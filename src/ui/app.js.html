<script>
/**
 * 앱 코어: API 래퍼(세션 토큰 자동 첨부), 해시 라우터, 레이아웃, 모달/토스트, 공통 헬퍼.
 * 화면은 App.views[name] = { title, render(el, params) } 로 등록한다.
 */
var App = (function () {
  var TOKEN_KEY = 'mac_token';
  var state = { token: null, boot: null, authMode: 'off', route: { name: 'dashboard', params: {} } };
  var views = {};
  var NAV = [
    ['dashboard', '대시보드'], ['calendar', '달력'], ['students', '학생'], ['meals', '급식'], ['settings', '설정'], ['logs', '알림 로그'], ['print', '인쇄'],
  ];

  // ---------- 헬퍼 ----------
  function h(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function pad(n) { return String(n).padStart(2, '0'); }
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
  function dow(d) { var p = d.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); }
  function fmtDate(d) { if (!d) return ''; var p = d.split('-').map(Number); return p[1] + '/' + p[2] + '(' + DAYS[dow(d)] + ')'; }
  function fmtDateLong(d) { var p = d.split('-').map(Number); return p[0] + '년 ' + p[1] + '월 ' + p[2] + '일 (' + DAYS[dow(d)] + ')'; }
  function addDays(d, n) { var p = d.split('-').map(Number); var t = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }
  function addMonths(ym, n) { var p = ym.split('-').map(Number); var t = new Date(Date.UTC(p[0], p[1] - 1 + n, 1)); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1); }
  function today() { return state.boot ? state.boot.today : new Date().toISOString().slice(0, 10); }
  function allergenName(c) { return (state.boot && state.boot.allergens[c]) || String(c); }
  /** 알레르기 칩. hits 에 든 코드는 강조, max 를 넘는 나머지는 "+N" 칩 하나로 접는다(툴팁에 전체) */
  function codeTags(codes, hits, max) {
    var list = codes || [];
    var shown = max && list.length > max ? list.slice(0, max) : list;
    var html = shown.map(function (c) { return '<span class="tag' + (hits && hits.indexOf(c) >= 0 ? ' hit' : '') + '">' + h(allergenName(c)) + '(' + c + ')</span>'; }).join('');
    if (shown.length < list.length) {
      var rest = list.slice(shown.length);
      var restHit = hits && rest.some(function (c) { return hits.indexOf(c) >= 0; });
      html += '<span class="tag more' + (restHit ? ' hit' : '') + '" title="' + h(rest.map(function (c) { return allergenName(c) + '(' + c + ')'; }).join(', ')) + '">+' + rest.length + '</span>';
    }
    return html;
  }
  function menuBadges(m) {
    var out = '';
    if (m.needsCheck) out += '<span class="badge warn">확인 필요</span>';
    if (m.checkedNone) out += '<span class="badge gray">없음 확인</span>';
    if (m.manualEdited || m.source === '수동') out += '<span class="badge purple">수동</span>';
    return out;
  }

  // ---------- 토스트 / 모달 ----------
  function toast(msg, type) {
    var el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    $('#toast-root').appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(function () { el.remove(); }, 300); }, type === 'danger' ? 5000 : 2800);
  }
  var modalStack = [];
  /**
   * 모달은 한 번에 하나만. 이미 열린 모달(확인창 제외)이 있으면 새 모달을 열지 않고 null 을 돌려준다.
   * opts.stackable=true 인 작은 확인창만 기존 모달 위에 겹칠 수 있다.
   */
  function modal(opts) {
    if (!opts.stackable && modalStack.some(function (m) { return !m.__stackable; })) return null;
    var root = $('#modal-root');
    var wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.__stackable = !!opts.stackable;
    wrap.innerHTML =
      '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog">' +
      '<div class="modal-head"><h3>' + h(opts.title || '') + '</h3><button class="btn icon ghost" data-close aria-label="닫기">✕</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.footer !== false ? '<div class="modal-foot">' + (opts.footer || '<button class="btn" data-close>닫기</button>') + '</div>' : '') +
      '</div>';
    root.appendChild(wrap);
    modalStack.push(wrap);
    var api = { el: wrap, close: function () { wrap.remove(); modalStack = modalStack.filter(function (m) { return m !== wrap; }); if (opts.onClose) opts.onClose(); } };
    wrap.addEventListener('click', function (e) { if (e.target === wrap || e.target.closest('[data-close]')) api.close(); });
    if (opts.onMount) opts.onMount(wrap, api);
    return api;
  }
  function confirmDialog(title, text, okLabel, danger) {
    return new Promise(function (resolve) {
      var m = modal({ title: title, body: '<p style="white-space:pre-wrap">' + h(text) + '</p>', stackable: true,
        footer: '<button class="btn" data-close>취소</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-ok>' + h(okLabel || '확인') + '</button>',
        onClose: function () { resolve(false); } });
      if (!m) { resolve(false); return; }
      $('[data-ok]', m.el).addEventListener('click', function () { resolve(true); m.close(); });
    });
  }
  /**
   * 작은 드롭다운 메뉴 (행의 "···" 더보기 등). anchor 아래 오른쪽 정렬로 띄우고, 바깥 클릭·Esc·스크롤·리사이즈에 닫힌다. 한 번에 하나만.
   * items: [{ label, danger?, onClick }]
   */
  var openDropdown = null;
  function closeDropdown() { if (openDropdown) { openDropdown.el.remove(); document.removeEventListener('click', openDropdown.onDoc, true); document.removeEventListener('keydown', openDropdown.onKey); window.removeEventListener('scroll', closeDropdown, true); window.removeEventListener('resize', closeDropdown); openDropdown = null; } }
  function dropdown(anchor, items) {
    if (openDropdown && openDropdown.anchor === anchor) { closeDropdown(); return null; }
    closeDropdown();
    var el = document.createElement('div');
    el.className = 'dropdown';
    el.innerHTML = items.map(function (it, i) { return '<button type="button" data-i="' + i + '"' + (it.danger ? ' class="danger"' : '') + '>' + h(it.label) + '</button>'; }).join('');
    document.body.appendChild(el);
    var r = anchor.getBoundingClientRect();
    var w = el.offsetWidth, hh = el.offsetHeight;
    var left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w));
    var top = r.bottom + 4 + hh > window.innerHeight ? r.top - hh - 4 : r.bottom + 4;
    el.style.left = (left + window.scrollX) + 'px';
    el.style.top = (top + window.scrollY) + 'px';
    el.addEventListener('click', function (e) { var b = e.target.closest('button[data-i]'); if (!b) return; e.stopPropagation(); closeDropdown(); items[Number(b.dataset.i)].onClick(); });
    var onDoc = function (e) { if (!el.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) closeDropdown(); };
    var onKey = function (e) { if (e.key === 'Escape') closeDropdown(); };
    setTimeout(function () { document.addEventListener('click', onDoc, true); }, 0);
    document.addEventListener('keydown', onKey);
    window.addEventListener('scroll', closeDropdown, true);
    window.addEventListener('resize', closeDropdown);
    openDropdown = { el: el, anchor: anchor, onDoc: onDoc, onKey: onKey };
    return el;
  }
  /**
   * 화면 컨테이너에 위임 이벤트 핸들러를 "교체" 방식으로 건다.
   * 화면을 다시 그릴 때마다 addEventListener 를 반복하면 핸들러가 누적되어 클릭 한 번에 여러 번 실행되므로(모달 중복 버그) 반드시 이 함수를 쓴다.
   */
  function on(el, type, fn) {
    var key = '__h_' + type;
    if (!el[key + '_bound']) {
      el.addEventListener(type, function (e) { if (el[key]) el[key](e); });
      el[key + '_bound'] = true;
    }
    el[key] = fn;
  }

  // ---------- API ----------
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) {
          var msg = err && err.message ? err.message : String(err);
          if (/AUTH_REQUIRED/.test(msg)) {
            setToken(null);
            if (state.authMode === 'on') renderLogin('세션이 만료되었습니다. 다시 로그인하세요.');
            else if (state.route.name === 'settings' && $('#main')) renderRoute(); // 설정 탭 잠금 패널로
            reject(new Error('AUTH_REQUIRED')); return;
          }
          msg = msg.replace(/^(Error|Exception):\s*/, '');
          reject(new Error(msg));
        });
      runner[name].apply(runner, [state.token].concat(args));
    });
  }
  function apiNoAuth(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) { reject(new Error(err && err.message ? err.message : String(err))); });
      runner[name].apply(runner, args);
    });
  }
  function setToken(t) { state.token = t; try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function loadToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function busy(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn.dataset.label = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span> ' + btn.dataset.label; } else if (btn.dataset.label) { btn.innerHTML = btn.dataset.label; } }
  function download(res) {
    var bin = atob(res.base64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var blob = new Blob([arr], { type: res.mime || 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = res.filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }
  function downloadXlsx(kind, params, btn) {
    busy(btn, true);
    return api('apiDownloadXlsx', kind, params || {}).then(function (r) { download(r); toast(r.filename + ' 다운로드', 'ok'); })
      .catch(function (e) { toast('다운로드 실패: ' + e.message, 'danger'); }).then(function () { busy(btn, false); });
  }
  // ---------- 클라이언트 데이터 캐시 (세션 동안 메모리 유지) ----------
  var dataCache = {};
  /** key 에 캐시가 있으면 즉시 반환, 없으면 loader() 결과를 저장. force=true 면 새로 받음 */
  function cached(key, loader, force) {
    if (!force && Object.prototype.hasOwnProperty.call(dataCache, key)) return Promise.resolve(dataCache[key]);
    return Promise.resolve(loader()).then(function (v) { dataCache[key] = v; return v; });
  }
  function cachePut(key, v) { dataCache[key] = v; }
  /** prefixes 로 시작하는 키 삭제. 인자 없으면 전부 */
  function invalidate(prefixes) {
    if (!prefixes) { dataCache = {}; return; }
    Object.keys(dataCache).forEach(function (k) {
      if (prefixes.some(function (p) { return k.indexOf(p) === 0; })) delete dataCache[k];
    });
  }
  /** 데이터 변경 종류별 무효화 */
  var INVALIDATE = {
    meals: ['dashboard', 'month:', 'day:', 'meals:'],
    students: ['dashboard', 'month:', 'day:', 'students', 'meals:'],
  };
  function changed(kind) { invalidate(INVALIDATE[kind] || null); }
  function prefetch(key, loader) { if (!Object.prototype.hasOwnProperty.call(dataCache, key)) setTimeout(function () { cached(key, loader).catch(function () {}); }, 300); }

  // ---------- 스켈레톤 ----------
  function skeleton(kind) {
    var stat = '<div class="card"><div class="sk sk-line" style="width:40%"></div><div class="sk" style="height:32px;width:55%;margin:10px 0"></div><div class="sk sk-line" style="width:70%"></div></div>';
    var rows = function (n) { var s = ''; for (var i = 0; i < n; i++) s += '<div class="sk-row"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>'; return s; };
    var head = '<div class="page-head"><div style="flex:1"><div class="sk sk-title"></div><div class="sk sk-line" style="width:30%"></div></div></div>';
    if (kind === 'dashboard') return head + '<div class="grid cols-4" style="margin-bottom:16px">' + stat + stat + stat + stat + '</div><div class="card"><div class="sk sk-line" style="width:20%"></div><div class="week-strip">' + '<div class="sk" style="height:70px"></div>'.repeat(7) + '</div></div><div class="card"><div class="sk sk-line" style="width:25%"></div><div class="grid cols-2"><div>' + '<div class="sk" style="height:40px;margin:6px 0"></div>'.repeat(5) + '</div><div>' + '<div class="sk" style="height:56px;margin:8px 0"></div>'.repeat(3) + '</div></div></div>';
    if (kind === 'calendar') return head + '<div class="card"><div class="cal-grid">' + '<div class="sk" style="height:18px"></div>'.repeat(7) + '<div class="sk sk-cell"></div>'.repeat(35) + '</div></div>';
    if (kind === 'day') return head + '<div class="card"><div class="sk sk-line" style="width:20%"></div><div class="grid cols-2"><div>' + '<div class="sk" style="height:40px;margin:6px 0"></div>'.repeat(7) + '</div><div>' + '<div class="sk" style="height:56px;margin:8px 0"></div>'.repeat(3) + '</div></div></div>';
    if (kind === 'stats-table') return head + '<div class="grid cols-3" style="margin-bottom:16px">' + stat + stat + stat + '</div><div class="card">' + rows(6) + '</div>';
    if (kind === 'form') return head + '<div class="card"><div class="sk sk-line" style="width:20%"></div><div class="form-grid">' + '<div><div class="sk sk-line" style="width:35%"></div><div class="sk" style="height:36px"></div></div>'.repeat(4) + '</div></div><div class="card"><div class="sk sk-line" style="width:20%"></div><div class="form-grid">' + '<div><div class="sk sk-line" style="width:35%"></div><div class="sk" style="height:36px"></div></div>'.repeat(4) + '</div></div>';
    return head + '<div class="card"><div class="sk sk-line" style="width:35%"></div>' + rows(8) + '</div>';
  }

  function readFileBase64(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
      fr.onerror = function () { reject(new Error('파일을 읽지 못했습니다')); };
      fr.readAsDataURL(file);
    });
  }

  // ---------- 라우터 / 레이아웃 ----------
  function parseHash() {
    var hash = location.hash.replace(/^#\/?/, '');
    var parts = hash.split('?');
    var seg = parts[0].split('/').filter(Boolean);
    var params = {};
    (parts[1] || '').split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
    return { name: seg[0] || 'dashboard', arg: seg[1] || '', params: params };
  }
  function go(path) { location.hash = '#/' + path; }
  function renderLayout() {
    var app = $('#app');
    var school = (state.boot && state.boot.settings['학교명']) || app.dataset.school || '';
    app.innerHTML =
      '<header class="topbar"><div class="topbar-inner">' +
      '<a class="brand" href="#/dashboard"><span class="logo">🍱</span><span>급식 알레르기</span>' + (school ? '<span class="school">' + h(school) + '</span>' : '') + '</a>' +
      '<nav class="nav">' + NAV.map(function (n) { return '<a href="#/' + n[0] + '" data-nav="' + n[0] + '">' + n[1] + (n[0] === 'settings' && state.authMode === 'settings' ? ' 🔒' : '') + '</a>'; }).join('') + '</nav>' +
      '<button class="btn sm ghost no-print" id="refresh-btn" title="이 화면의 데이터를 서버에서 다시 받습니다">↻ 새로고침</button>' +
      (state.authMode !== 'off' ? '<button class="btn sm ghost no-print" id="logout-btn"' + (state.token ? '' : ' hidden') + '>로그아웃</button>' : '') +
      '</div></header><main class="main" id="main"></main>';
    var lo = $('#logout-btn');
    if (lo) lo.addEventListener('click', function () {
      api('apiLogout').catch(function () {}); setToken(null); invalidate();
      if (state.authMode === 'on') renderLogin(); else { lo.hidden = true; renderRoute(); }
    });
    $('#refresh-btn').addEventListener('click', function () { invalidate(); refreshBoot().then(renderRoute, renderRoute); });
  }
  /** 화면을 그릴 수 있는 상태인가. 토큰은 '전체 잠금(on)' 모드에서만 필수 — off/settings 모드는 토큰 없이 렌더한다 */
  function canRender() {
    return !!state.boot && (state.authMode !== 'on' || !!state.token);
  }
  function renderRoute() {
    if (!canRender()) return;
    if (!$('#main')) renderLayout();
    var r = parseHash();
    state.route = r;
    $$('[data-nav]').forEach(function (a) { a.classList.toggle('active', a.dataset.nav === r.name); });
    var view = views[r.name] || views.dashboard;
    // 떠나는 화면의 정리 훅 (타이머·전역 리스너·body 클래스 등). 전광판처럼 화면 밖 상태를 만드는 뷰가 구현한다
    if (state.view && state.view !== view && typeof state.view.leave === 'function') {
      try { state.view.leave(); } catch (e) { /* 무시 */ }
    }
    state.view = view;
    var main = $('#main');
    main.innerHTML = skeleton(view.skeleton || 'table');
    document.title = (view.title || '') + ' · 급식 알레르기 판별';
    Promise.resolve(view.render(main, r)).catch(function (e) {
      if (e.message === 'AUTH_REQUIRED') return;
      main.innerHTML = '<div class="card"><div class="notice danger">화면을 불러오지 못했습니다: ' + h(e.message) + '</div></div>';
    });
  }
  /** 로그인 패널을 container 에 그린다. 성공 시 토큰 저장 후 onSuccess() */
  function loginPanel(container, opts) {
    var o = opts || {};
    container.innerHTML =
      '<div class="card login-card" style="margin:0 auto">' +
      '<h1>' + (o.title || '🍱 급식 알레르기 판별') + '</h1><p class="sub">' + h(o.sub || '접속 비밀번호를 입력하세요') + '</p>' +
      (o.message ? '<div class="notice warn" style="margin-bottom:12px">' + h(o.message) + '</div>' : '') +
      '<form class="login-form"><div class="field"><input type="password" class="pw" placeholder="비밀번호" autocomplete="current-password" autofocus></div>' +
      '<div class="login-err error-text" style="margin:8px 0;min-height:18px"></div>' +
      '<button class="btn primary" style="width:100%;justify-content:center">로그인</button></form>' +
      '<p class="small muted" style="margin-top:14px">비밀번호는 스프레드시트 메뉴 [급식 알레르기] → 접속 비밀번호 → 비밀번호 재설정으로 다시 만들 수 있습니다.</p>' +
      '</div>';
    var form = $('.login-form', container);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = $('button', form); busy(btn, true); $('.login-err', container).textContent = '';
      apiNoAuth('apiLogin', $('.pw', container).value).then(function (r) {
        if (!r.ok) { $('.login-err', container).textContent = r.error; busy(btn, false); return; }
        setToken(r.token);
        var lo = $('#logout-btn'); if (lo) lo.hidden = false;
        if (o.onSuccess) o.onSuccess();
      }).catch(function (e) { $('.login-err', container).textContent = e.message; busy(btn, false); });
    });
  }
  /** 전체 잠금 모드의 로그인 화면 */
  function renderLogin(message) {
    $('#app').innerHTML = '<div class="login-wrap" id="login-wrap"></div>';
    loginPanel($('#login-wrap'), { message: message, onSuccess: boot });
  }
  /** 로그인 직후: 부트스트랩 + 대시보드 + 이번 달 달력을 한 번의 호출로 받아 캐시에 넣는다 */
  function boot() {
    return api('apiInit').then(function (r) {
      state.boot = r.boot;
      cachePut('dashboard', r.dashboard);
      if (r.month) cachePut('month:' + r.month.ym, r.month);
      renderLayout(); renderRoute();
    }).catch(function (e) { if (e.message !== 'AUTH_REQUIRED') { setToken(null); renderLogin(e.message); } });
  }
  function refreshBoot() { return api('apiBootstrap').then(function (b) { state.boot = b; return b; }); }
  /**
   * HtmlService 는 앱을 2겹 iframe 안에 띄우므로 주소창의 #/board 같은 해시가 여기(안쪽 프레임)까지 오지 않는다.
