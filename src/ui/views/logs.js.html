<script>
/**
 * 알림 로그 (#/logs): 문자·텔레그램 등 발송 기록 표. 실패 행은 빨간 배경.
 * 필터(실패만·표시 건수)는 URL 파라미터(?failed=1&limit=N)로 유지 — 대시보드의 "로그 보기" 링크와 새로고침에도 상태가 남는다.
 * 캐시 없이 매번 서버에서 받는다 (로그는 항상 최신이어야 의미가 있음).
 */
App.views.logs = {
  title: '알림 로그',
  // el 에 표를 그린다. r.params 로 필터를 읽으므로 필터 변경 = 해시 이동 = 재렌더
  render: function (el, r) {
    var h = App.h;
    var self = this;
    var failedOnly = r.params && r.params.failed === '1';
    var limit = Number((r.params && r.params.limit) || 200);
    return App.api('apiLogs', { limit: limit, failedOnly: failedOnly }).then(function (rows) {
      el.innerHTML =
        '<div class="page-head"><div><h2>알림 로그</h2><div class="sub">최근 ' + limit + '건' + (failedOnly ? ' 중 실패만' : '') + ' · 표시 ' + rows.length + '건</div></div>' +
        '<div class="actions"><label class="check"><input type="checkbox" id="failed"' + (failedOnly ? ' checked' : '') + '> 실패만</label>' +
        '<select id="limit" style="width:auto"><option' + (limit === 100 ? ' selected' : '') + '>100</option><option' + (limit === 200 ? ' selected' : '') + '>200</option><option' + (limit === 500 ? ' selected' : '') + '>500</option></select>' +
        '<button class="btn" id="refresh">새로고침</button></div></div>' +
        '<div class="card"><div class="table-wrap fit tall uniform"><table><colgroup><col style="width:160px"><col style="width:100px"><col style="width:84px"><col style="width:200px"><col style="width:104px"><col><col style="width:76px"></colgroup>' +
        '<thead><tr><th>발송시각</th><th>종류</th><th>채널</th><th>수신자</th><th>대상일</th><th>내용 (마우스를 올리면 전체)</th><th class="center">결과</th></tr></thead><tbody>' +
        (rows.length ? rows.map(function (l) {
          var full = l.summary + (l.error ? ' — 오류: ' + l.error : '');
          return '<tr' + (l.ok ? '' : ' class="row-error"') + '><td class="small">' + h(l.sentAt) + '</td><td>' + h(l.kind) + '</td><td>' + h(l.channel) + '</td><td class="small" title="' + h(l.recipient) + '">' + h(l.recipient) + '</td><td class="small">' + h(l.targetDate) + '</td>' +
            '<td class="small" title="' + h(full) + '">' + (l.error ? '<span class="error-text">' + h(l.error) + '</span> · ' : '') + h(l.summary) + '</td><td class="center">' + (l.ok ? '<span class="badge ok fixed">성공</span>' : '<span class="badge danger fixed">실패</span>') + '</td></tr>';
        }).join('') : '<tr><td colspan="7" class="empty">기록이 없습니다</td></tr>') +
        '</tbody></table></div></div>';
      // 필터 변경 시 해시만 바꾼다 → 라우터가 새 파라미터로 이 화면을 다시 그림
      var nav = function () { App.go('logs?failed=' + (App.$('#failed').checked ? 1 : 0) + '&limit=' + App.$('#limit').value); };
      App.$('#failed').onchange = nav;
      App.$('#limit').onchange = nav;
      App.$('#refresh').onclick = function () { self.render(el, r); };
    });
  },
};
</script>
