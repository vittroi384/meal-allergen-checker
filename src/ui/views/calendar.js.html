<script>
/* 월간 달력(일요일 시작) + 날짜 상세(메뉴 편집, 영향 미리보기) */
App.views.calendar = {
  title: '달력',
  skeleton: 'calendar',
  render: function (el, r) {
    var h = App.h;
    var ym = /^\d{4}-\d{2}$/.test(r.arg) ? r.arg : App.today().slice(0, 7);
    return App.cached('month:' + ym, function () { return App.api('apiMonth', ym); }).then(function (m) {
      [App.addMonths(ym, -1), App.addMonths(ym, 1)].forEach(function (nm) { App.prefetch('month:' + nm, function () { return App.api('apiMonth', nm); }); });
      var byDate = {};
      m.days.forEach(function (d) { byDate[d.date] = d; });
      var lead = App.dow(m.start); // 일요일 시작: 0=일
      var cells = [];
      for (var i = 0; i < lead; i++) cells.push(null);
      var cur = m.start;
      while (cur <= m.end) { cells.push(cur); cur = App.addDays(cur, 1); }
      while (cells.length % 7) cells.push(null);
      var p = ym.split('-');
      var todayStr = App.today();
      var totalAffected = 0, totalUnchecked = 0;
      m.days.forEach(function (d) { totalAffected += d.affectedCount; totalUnchecked += d.uncheckedCount; });

      el.innerHTML =
        '<div class="page-head"><div><h2>' + p[0] + '년 ' + Number(p[1]) + '월</h2><div class="sub">급식일 ' + m.days.length + '일 · 해당 연인원 ' + totalAffected + '명 · 확인 필요 메뉴 ' + totalUnchecked + '개</div></div>' +
        '<div class="actions"><button class="btn" id="prev">‹ 이전 달</button><button class="btn" id="today">이번 달</button><button class="btn" id="next">다음 달 ›</button><input type="month" id="pick" value="' + ym + '">' +
        '<button class="btn primary" id="dl">이 달 결과 xlsx</button></div></div>' +
        '<div class="card"><div class="cal-grid">' +
        ['일', '월', '화', '수', '목', '금', '토'].map(function (d, i) { return '<div class="cal-dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + d + '</div>'; }).join('') +
        cells.map(function (d) {
          if (!d) return '<div class="cal-cell other"></div>';
          var info = byDate[d];
          var dw = App.dow(d);
          var weekend = dw === 0 || dw === 6;
          var cls = 'cal-cell' + (d === todayStr ? ' today' : '') + (dw === 0 ? ' sun' : dw === 6 ? ' sat' : '') + (!info || weekend ? ' dim' : '');
          var cnt = info ? '<div class="cnt ' + (info.affectedCount ? '' : 'zero') + '">' + info.affectedCount + '</div>' : '<div class="cnt none">' + (weekend ? '' : '급식 없음') + '</div>';
          var badges = info ? (info.uncheckedCount ? '<span class="badge warn tiny">확인 ' + info.uncheckedCount + '</span>' : '') + (info.manualProtected ? '<span class="badge purple tiny">수동</span>' : '') : '';
          return '<div class="' + cls + '" data-day="' + d + '"><div class="d">' + Number(d.slice(8)) + '</div>' + cnt + '<div class="badges">' + badges + '</div></div>';
        }).join('') +
        '</div><p class="small muted" style="margin-top:10px">숫자는 그날 급식을 못 먹는 학생 수(관리 끼니 기준). 0은 해당 없음, 흐린 칸은 주말·급식 없음. 날짜를 누르면 메뉴와 학생을 보고 편집할 수 있습니다.</p></div>';
      App.$('#prev').onclick = function () { App.go('calendar/' + App.addMonths(ym, -1)); };
      App.$('#next').onclick = function () { App.go('calendar/' + App.addMonths(ym, 1)); };
      App.$('#today').onclick = function () { App.go('calendar/' + todayStr.slice(0, 7)); };
      App.$('#pick').onchange = function (e) { if (e.target.value) App.go('calendar/' + e.target.value); };
      App.$('#dl').onclick = function (e) { App.downloadXlsx('month', { ym: ym }, e.currentTarget); };
      App.on(el, 'click', function (e) {
        var cell = e.target.closest('[data-day]');
        if (cell) App.go('day/' + cell.dataset.day);
      });
    });
  },
};

/**
 * 해당 학생 목록 — 반별 그룹 컴포넌트 (대시보드·날짜 상세·메뉴 편집 미리보기 공용).
 *  - 반 헤더("1-1 · 담임 OOO 010-… · n명")가 먼저, 접힌 상태에서는 이름 쉼표 요약. 클릭으로 펼침/접힘
 *  - 펼치면 학생 카드(이름, 원인 메뉴, 알레르기 칩(원인 강조), 비고). 카드 클릭 → 학생 수정 모달 (opts.noEdit 면 비활성)
 *  - 상단 "전체 펼치기/접기". 열림 상태는 ctx 별로 sessionStorage 에 기억. 반이 하나거나 5명 이하면 기본 펼침
 * @param affected [{ student, items?: [{menu, reasons, matchedCodes, matchedKeywords}], text }]
 * @param opts { ctx: 상태 저장 키(화면·끼니별), noEdit: 카드 클릭 비활성 }
 */
App._aff = { students: {}, data: {}, state: (function () { try { return JSON.parse(sessionStorage.getItem('mac_aff') || '{}'); } catch (e) { return {}; } })() };
App._aff.save = function () { try { sessionStorage.setItem('mac_aff', JSON.stringify(App._aff.state)); } catch (e) { /* 무시 */ } };

App.affectedListHtml = function (affected, emptyText, opts) {
  var h = App.h;
  var o = opts || {};
  var ctx = o.ctx || 'default';
  var A = App._aff;
  A.data[ctx] = { affected: affected, emptyText: emptyText, opts: o };

  var groups = [], byKey = {};
  affected.forEach(function (a) {
    var st = a.student;
    var k = st.grade + '-' + st.classNo;
    if (!byKey[k]) { byKey[k] = { key: k, teacher: st.teacherLabel || '', items: [] }; groups.push(byKey[k]); }
    byKey[k].items.push(a);
    if (st._row) A.students[st._row] = st;
  });
  var defOpen = groups.length <= 1 || affected.length <= 5;
  var all = A.state['all:' + ctx];
  var isOpen = function (k) {
    var v = A.state[ctx + '|' + k];
    if (v === true || v === false) return v;
    if (all === 'open' || all === 'closed') return all === 'open';
    return defOpen;
  };
  var allOpen = groups.length > 0 && groups.every(function (g) { return isOpen(g.key); });

  var card = function (a) {
    var st = a.student;
    var hitCodes = [], hitKw = [];
    (a.items || []).forEach(function (it) { (it.matchedCodes || []).forEach(function (c) { if (hitCodes.indexOf(c) < 0) hitCodes.push(c); }); (it.matchedKeywords || []).forEach(function (k) { if (hitKw.indexOf(k) < 0) hitKw.push(k); }); });
    var why = a.items ? a.items.map(function (it) { return h(it.menu) + (it.reasons && it.reasons.length ? '(' + h(it.reasons.join(', ')) + ')' : ''); }).join(' · ') : h(a.text || '');
    var editable = !o.noEdit && st._row;
    return '<div class="affected-item' + (editable ? ' clickable' : '') + '"' + (editable ? ' data-row="' + st._row + '" title="클릭하면 학생 정보를 수정합니다"' : '') + '>' +
      '<div class="who"><span>' + h(st.name || st.label) + (st.note ? '<span class="note">' + h(st.note) + '</span>' : '') + '</span></div>' +
      '<div class="why">' + why + '</div>' +
      ((st.codes && st.codes.length) || (st.keywords && st.keywords.length)
        ? '<div class="tags">' + App.codeTags(st.codes || [], hitCodes) + (st.keywords || []).map(function (k) { return '<span class="tag kw' + (hitKw.indexOf(k) >= 0 ? ' hit' : '') + '">' + h(k) + '</span>'; }).join('') + '</div>' : '') +
      '</div>';
  };

  return '<div class="list-box affected-box" data-ctx="' + h(ctx) + '">' +
    '<div class="list-head"><span>해당 학생</span><span class="right">' +
    (groups.length > 1 ? '<button type="button" class="btn sm ghost" data-aff-all="' + h(ctx) + '">' + (allOpen ? '전체 접기' : '전체 펼치기') + '</button>' : '') +
    '<span class="badge ' + (affected.length ? 'danger' : 'ok') + '">' + affected.length + '명</span></span></div>' +
    '<div class="list-scroll">' +
    (groups.length ? groups.map(function (g) {
      var names = g.items.map(function (a) { return a.student.name || a.student.label; });
      return '<div class="aff-group' + (isOpen(g.key) ? ' open' : '') + '" data-g="' + h(g.key) + '">' +
        '<div class="aff-head" title="클릭하여 펼치기/접기"><span class="chev">▶</span><b>' + h(g.key) + '</b>' +
        (g.teacher ? '<span class="t">' + h(g.teacher) + '</span>' : '') + '<span class="n">' + g.items.length + '명</span>' +
        '<span class="sum" title="' + h(names.join(', ')) + '">' + h(names.join(', ')) + '</span></div>' +
        '<div class="aff-body">' + g.items.map(card).join('') + '</div></div>';
    }).join('') : '<div class="empty">' + h(emptyText || '해당 학생 없음 🎉') + '</div>') +
    '</div></div>';
};

/** 반 그룹 펼침/접힘·전체 토글·카드 클릭(학생 수정) — 문서 단위 위임 1회 */
if (!App._aff.bound) {
  App._aff.bound = true;
  document.addEventListener('click', function (e) {
    var A = App._aff;
    var allBtn = e.target.closest('[data-aff-all]');
    if (allBtn) {
      var ctx = allBtn.dataset.affAll;
      var box = allBtn.closest('.affected-box');
      var open = App.$$('.aff-group', box);
      var allOpen = open.length && open.every(function (g) { return g.classList.contains('open'); });
      Object.keys(A.state).forEach(function (k) { if (k.indexOf(ctx + '|') === 0) delete A.state[k]; });
      A.state['all:' + ctx] = allOpen ? 'closed' : 'open';
      A.save();
      var d = A.data[ctx];
      if (d && box) { var tmp = document.createElement('div'); tmp.innerHTML = App.affectedListHtml(d.affected, d.emptyText, d.opts); box.replaceWith(tmp.firstChild); }
      return;
    }
    var head = e.target.closest('.aff-head');
    if (head) {
      var g = head.parentNode, gbox = g.closest('.affected-box');
      var gctx = gbox ? gbox.dataset.ctx : 'default';
      var nowOpen = !g.classList.contains('open');
      g.classList.toggle('open', nowOpen);
      A.state[gctx + '|' + g.dataset.g] = nowOpen;
      A.save();
      var btn = gbox && App.$('[data-aff-all]', gbox);
      if (btn) btn.textContent = App.$$('.aff-group', gbox).every(function (x) { return x.classList.contains('open'); }) ? '전체 접기' : '전체 펼치기';
      return;
    }
    var item = e.target.closest('.affected-item.clickable');
    if (item) {
      var st = A.students[item.dataset.row];
      if (st) App.studentEditor(st, App.state.boot.schoolYear, function () { App.changed('students'); App.rerender(); });
    }
  });
}

App.views.day = {
  title: '날짜 상세',
  skeleton: 'day',
  render: function (el, r) {
    var h = App.h;
    var date = /^\d{4}-\d{2}-\d{2}$/.test(r.arg) ? r.arg : App.today();
    var self = this;
    var reload = function () { App.changed('meals'); return self.render(el, r); };
    return App.cached('day:' + date, function () { return App.api('apiDay', date); }).then(function (d) {
      var html = '<div class="page-head"><div><h2>' + h(d.label) + '</h2><div class="sub"><a href="#/calendar/' + date.slice(0, 7) + '">← 달력</a></div></div>' +
        '<div class="actions"><button class="btn" id="prev">‹ 전날</button><button class="btn" id="next">다음날 ›</button><input type="date" id="pick" value="' + date + '"><button class="btn primary" id="dl">이 날 결과 xlsx</button></div></div>';
      d.mealTypes.forEach(function (t) {
        var res = d.byType[t];
        html += '<div class="card" data-type="' + h(t) + '"><div class="card-head"><h3>' + h(t) +
          (res.menus.length ? '<span class="badge ' + (res.count ? 'danger' : 'ok') + '">해당 ' + res.count + '명</span>' : '<span class="badge gray">데이터 없음</span>') +
          (res.protected ? '<span class="badge purple" title="이 끼니는 수동으로 수정되어 NEIS 재동기화 때 덮어쓰지 않습니다">수동 보호</span>' : '') + '</h3>' +
          '<div class="actions"><button class="btn sm" data-add="' + h(t) + '">+ 메뉴 추가</button>' +
          (res.protected ? '<button class="btn sm danger" data-revert="' + h(t) + '">NEIS 데이터로 되돌리기</button>' : '') + '</div></div>';
        if (res.protected) html += '<div class="notice info small" style="margin-bottom:10px">이 끼니는 수동 수정됨 — 자동 동기화가 건너뜁니다. NEIS 원본으로 돌리려면 "NEIS 데이터로 되돌리기"를 누르세요.</div>';
        html += '<div class="grid cols-2"><div class="list-box"><div class="list-head"><span>메뉴</span><span class="badge gray">' + res.menus.length + '개</span></div><div class="list-scroll">';
        // 메뉴 목록은 대시보드와 같은 공용 컴포넌트 (행 클릭 → 확인 팝오버/수정, ··· → 수정/확인 취소/삭제)
        html += res.menus.length ? App.menuListHtml(res.menus, { ctx: 'day:' + date + ':' + t, reload: reload }) : '<div class="empty">메뉴가 없습니다. 동기화하거나 직접 추가하세요.</div>';
        html += '</div></div>' + App.affectedListHtml(res.affected, res.menus.length ? '해당 학생 없음 🎉' : '', { ctx: 'day:' + date + ':' + t }) + '</div>';
        if (res.uncheckedMenus.length) html += '<div class="notice warn small" style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span><b>확인 필요 ' + res.uncheckedMenus.length + '개</b> — 알레르기 표시가 없는 메뉴: ' + h(res.uncheckedMenus.join(', ')) + '</span><button type="button" class="btn sm primary" data-review="' + h(t) + '" style="margin-left:auto">일괄 검토</button></div>';
        html += '</div>';
      });
      el.innerHTML = html;

      App.$('#prev').onclick = function () { App.go('day/' + App.addDays(date, -1)); };
      App.$('#next').onclick = function () { App.go('day/' + App.addDays(date, 1)); };
      App.$('#pick').onchange = function (e) { if (e.target.value) App.go('day/' + e.target.value); };
      App.$('#dl').onclick = function (e) { App.downloadXlsx('day', { date: date }, e.currentTarget); };
      // 메뉴 행 자체의 동작(팝오버·드롭다운·삭제)은 공용 컴포넌트가 처리. 여기서는 끼니 단위 버튼만
      App.on(el, 'click', function (e) {
        var b = e.target.closest('button');
        if (!b || !el.contains(b)) return;
        if (b.dataset.add) return App.menuEditor({ date: date, mealType: b.dataset.add }, reload);
        if (b.dataset.review) {
          var t0 = b.dataset.review;
          return App.reviewUnchecked(d.byType[t0].menus.filter(function (m) { return m.needsCheck; }), { date: date, mealType: t0 }, reload);
        }
        if (b.dataset.revert) {
          var t = b.dataset.revert;
          return App.confirm('NEIS 데이터로 되돌리기', date + ' ' + t + '의 모든 메뉴(수동 입력 포함)를 삭제하고 NEIS 원본으로 다시 채웁니다. 계속할까요?', '되돌리기', true).then(function (ok) {
            if (!ok) return;
            App.busy(b, true);
            App.api('apiRevertMeal', date, t).then(function (res) {
              if (!res.ok) throw new Error(res.error);
              App.toast('NEIS 데이터로 되돌렸습니다 (' + res.inserted + '개 메뉴)' + (res.error ? ' — ' + res.error : ''), 'ok'); reload();
            }).catch(function (err) { App.toast(err.message, 'danger'); App.busy(b, false); });
          });
        }
      });
    });
  },
};

/**
 * 메뉴 목록 공용 컴포넌트 (대시보드·날짜 상세).
 *  - 행 클릭: "확인 필요"(노란) 행 → 확인 팝오버(없음 확인 / 코드 입력 / 취소) — 처리 진입점은 이것 하나. 그 외 행 → 수정 모달
 *  - 행 오른쪽 "···" → 수정 / (확인됨이면) 확인 취소 / 삭제… (삭제는 행 안 인라인 확인)
 *  - 확인 후 흰 행 + 회색 "확인됨" 배지(툴팁에 확인 시각)
 * @param menus serializeMenu_ 배열 (_row 필수)
 * @param opts { ctx: 목록 식별자, reload: 변경 후 호출할 함수(Promise 가능) }
 */
App._menu = { rows: {}, ctx: {}, bound: false };
App.menuRowHtml = function (m) {
  var h = App.h;
  var badge = m.needsCheck
    ? '<span class="badge warn">확인 필요</span>'
    : (m.checkedNone ? '<span class="badge gray" title="' + h(m.checkedAt ? '알레르기 없음으로 확인 · ' + m.checkedAt : '알레르기 없음으로 확인됨') + '">확인됨</span>' : '') +
      (m.manualEdited || m.source === '수동' ? '<span class="badge purple">수동</span>' : '');
  // 열: 이름(가변) | 칩+배지 고정 폭(오른쪽 정렬, 어느 행이든 세로선이 맞음) | ··· 28px
  return '<div class="menu-item row' + (m.needsCheck ? ' needs' : '') + '" data-menu="' + m._row + '" title="' + (m.needsCheck ? '클릭하여 확인 처리' : '클릭하여 수정') + '">' +
    '<span class="name">' + h(m.name) + '</span>' +
    '<span class="meta"><span class="tags">' + App.codeTags(m.codes, null, 3) + '</span>' + badge + '</span>' +
    '<button type="button" class="more-btn" data-more="' + m._row + '" aria-label="더보기" title="더보기">···</button></div>';
};
App.menuListHtml = function (menus, opts) {
  var o = opts || {};
  var ctx = o.ctx || 'default';
  App._menu.ctx[ctx] = { reload: o.reload || function () { App.changed('meals'); App.rerender(); } };
  menus.forEach(function (m) { if (m._row) App._menu.rows[m._row] = m; });
  return '<div class="menu-list" data-mctx="' + App.h(ctx) + '">' + menus.map(App.menuRowHtml).join('') + '</div>';
};
if (!App._menu.bound) {
  App._menu.bound = true;
  document.addEventListener('click', function (e) {
    var list = e.target.closest('.menu-list[data-mctx]');
    if (!list) return;
    var M = App._menu, ctx = M.ctx[list.dataset.mctx];
    var row = e.target.closest('.menu-item[data-menu]');
    if (!ctx || !row) return;
    var m = M.rows[row.dataset.menu];
    if (!m) return;
    var h = App.h;
    var reload = function () { return Promise.resolve(ctx.reload()); };
    var check = function (on) {
      row.classList.add('pending');
      App.api('apiMarkMenuChecked', Number(m._row), on).then(function () { App.toast(on ? '확인 처리했습니다' : '확인을 취소했습니다', 'ok'); return reload(); })
        .catch(function (err) { App.toast(err.message, 'danger'); row.classList.remove('pending'); });
    };
    var b = e.target.closest('button');
    if (b && b.dataset.more) {
      // ··· 는 삭제만. 수정은 행 클릭(확인 필요 행은 팝오버 → 수정), 확인 취소는 수정 모달의 "없음 확인" 체크 해제
      App.dropdown(b, [{ label: '삭제…', danger: true, onClick: function () {
        row.classList.add('confirm-del'); row.title = '';
        row.innerHTML = '<div class="del-inline"><span>"<b>' + h(m.name) + '</b>" 삭제하시겠습니까? 이 끼니는 수동 보호 상태가 됩니다.</span><span class="sp"></span>' +
          '<button type="button" class="btn sm danger" data-del-yes="1">삭제</button><button type="button" class="btn sm" data-del-no="1">취소</button></div>';
      } }]);
      return;
    }
    if (b && b.dataset.delYes) {
      App.busy(b, true);
      App.api('apiDeleteMenu', Number(m._row)).then(function () { App.toast('삭제했습니다', 'ok'); return reload(); }).catch(function (err) { App.toast(err.message, 'danger'); App.busy(b, false); });
      return;
    }
    if (b && b.dataset.delNo) { row.outerHTML = App.menuRowHtml(m); return; }
    if (b) return;
    if (row.classList.contains('confirm-del') || row.classList.contains('pending')) return;
    if (m.needsCheck) {
      App.popover(row, '<b>' + h(m.name) + '</b><br>이 메뉴에 알레르기 유발 식품이 없는 것을 확인하셨나요?', [
        { label: '없음 확인', primary: true, onClick: function () { check(true); } },
        { label: '수정', onClick: function () { App.menuEditor(m, reload); } },
        { label: '취소' },
      ]);
    } else {
      App.menuEditor(m, reload);
    }
  });
}

/**
 * "확인 필요" 메뉴 일괄 검토 모달: 하나씩 넘기며 [없음 확인] [코드 입력] [건너뛰기].
 * menus: needsCheck 메뉴 배열(serializeMenu_ 형태, raw 포함). ctx: { date, mealType }. onDone: 끝나거나 닫을 때 (변경이 있었으면) 호출
 */
App.reviewUnchecked = function (menus, ctx, onDone) {
  var h = App.h;
  if (!menus.length) { App.toast('확인 필요 메뉴가 없습니다', 'ok'); return; }
  var idx = 0, done = 0, skipped = 0, changed = false;
  var body = '<div class="review-progress"><span id="rv-pos"></span><span class="bar"><i id="rv-bar"></i></span><span>' + h(ctx.date) + ' ' + h(ctx.mealType) + '</span></div><div id="rv-item"></div>' +
    '<p class="small muted" style="margin-top:10px">NEIS 원문에 알레르기 번호가 없는 메뉴입니다. 실제로 유발 식품이 없으면 <b>없음 확인</b>, 번호가 빠진 것이면 <b>코드 입력</b>으로 넣어 주세요.</p><div id="rv-err" class="error-text" style="margin-top:6px"></div>';
  var modal = App.modal({
    title: '확인 필요 메뉴 일괄 검토 (' + menus.length + '개)', body: body,
    footer: '<button class="btn" data-close>닫기</button><span class="left"></span><button class="btn" id="rv-skip">건너뛰기</button><button class="btn" id="rv-edit">코드 입력</button><button class="btn primary" id="rv-ok">없음 확인</button>',
    onClose: function () { if (changed && onDone) onDone(); },
    onMount: function (el, api) {
      var show = function () {
        if (idx >= menus.length) {
          App.toast('검토 완료 — 확인 ' + done + '개, 건너뜀 ' + skipped + '개', 'ok');
          api.close();
          return;
        }
        var m = menus[idx];
        App.$('#rv-pos', el).textContent = (idx + 1) + ' / ' + menus.length;
        App.$('#rv-bar', el).style.width = Math.round((idx / menus.length) * 100) + '%';
        App.$('#rv-item', el).innerHTML = '<div class="review-item"><div class="rv-name">' + h(m.name) + '</div>' +
          '<div class="small muted">원본 NEIS 문자열</div><div class="rv-raw">' + (m.raw ? h(m.raw) : '<span class="muted">(없음 — 수동 입력 메뉴)</span>') + '</div>' +
          '<div class="rv-meta">' + h(m.date) + ' · ' + h(m.mealType) + (m.manualEdited ? ' · 수동 수정됨' : '') + '</div></div>';
        App.$('#rv-err', el).textContent = '';
      };
      var setBusy = function (on) { ['#rv-skip', '#rv-edit', '#rv-ok'].forEach(function (s) { App.$(s, el).disabled = on; }); };
      App.$('#rv-ok', el).addEventListener('click', function () {
        var m = menus[idx];
        setBusy(true);
        App.api('apiMarkMenuChecked', Number(m._row), true).then(function () { changed = true; done++; idx++; setBusy(false); show(); })
          .catch(function (err) { setBusy(false); App.$('#rv-err', el).textContent = err.message; });
      });
      App.$('#rv-skip', el).addEventListener('click', function () { skipped++; idx++; show(); });
      App.$('#rv-edit', el).addEventListener('click', function () {
        var m = menus[idx];
        var wasChanged = changed; changed = false; // 닫힐 때 중복 reload 방지 — 편집기 저장이 reload 를 담당
        api.close();
        App.menuEditor(m, function () { if (onDone) onDone(); });
        if (wasChanged) { /* 이미 처리한 건은 편집기 저장 시 reload 로 반영됨 */ }
      });
      show();
    },
  });
  if (!modal) App.toast('먼저 열려 있는 창을 닫아 주세요');
};

/**
 * 메뉴 추가/수정 모달 + "이 메뉴 해당 학생" 실시간 미리보기.
 * m = { _row?, date, mealType, name?, codes?, checkedNone? }
 */
App.menuEditor = function (m, onSaved) {
  var h = App.h;
  var allergens = App.state.boot.allergens;
  var codes = m.codes || [];
  var body =
    '<div class="form-grid">' +
    '<div class="field"><label>날짜</label><input type="date" id="me-date" value="' + h(m.date) + '"></div>' +
    '<div class="field"><label>식사구분</label><select id="me-type">' + App.state.boot.allMealTypes.map(function (t) { return '<option' + (t === m.mealType ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
    '<div class="field full"><label>메뉴명</label><input type="text" id="me-name" value="' + h(m.name || '') + '" placeholder="예: 돈까스" autofocus><div id="me-kw" class="small" style="margin-top:6px"></div></div>' +
    '<div class="field full"><label>알레르기 유발식품 (해당 항목 체크)</label><div class="codes-grid">' +
    Object.keys(allergens).map(function (c) { return '<label class="check"><input type="checkbox" value="' + c + '"' + (codes.indexOf(Number(c)) >= 0 ? ' checked' : '') + '> ' + c + '. ' + h(allergens[c]) + '</label>'; }).join('') +
    '</div></div>' +
    '<div class="field full"><label class="check"><input type="checkbox" id="me-none"' + (m.checkedNone ? ' checked' : '') + '> 알레르기 유발식품 없음을 확인함 (체크하면 "확인 필요" 표시가 사라집니다)</label></div>' +
    '<div class="field full"><label>이 메뉴 해당 학생 <span class="small muted" style="font-weight:400">— 체크를 바꾸면 즉시 갱신됩니다 (저장 전 영향 확인)</span></label><div id="me-preview"><div class="loading" style="padding:10px"><span class="spinner"></span> 학생 정보 불러오는 중…</div></div></div>' +
    '</div><div id="me-err" class="error-text" style="margin-top:8px"></div>';
  var modal = App.modal({
    title: m._row ? '메뉴 수정' : '메뉴 추가', body: body,
    footer: '<span class="left small muted">저장하면 이 끼니는 수동 보호되어 자동 동기화가 덮어쓰지 않습니다</span><button class="btn" data-close>취소</button><button class="btn primary" id="me-save">저장</button>',
    onMount: function (el, api) {
      var students = null;
      var norm = function (s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); };
      /** 학생 키워드 → 매칭 용어(관리 목록에 있으면 동의어 포함, 없으면 그 단어 그대로) */
      function terms(k) {
        var list = App.state.boot.keywordList || [];
        var e = list.filter(function (x) { return norm(x.word) === norm(k) || x.synonyms.some(function (s) { return norm(s) === norm(k); }); })[0];
        return e ? [e.word].concat(e.synonyms, [k]) : [k];
      }
      function renderKeywordInfo(name) {
        var box = App.$('#me-kw', el);
        var list = App.state.boot.keywordList || [];
        var found = list.filter(function (e) { return [e.word].concat(e.synonyms).some(function (t) { var nt = norm(t); return nt && name.indexOf(nt) >= 0; }); }).map(function (e) { return e.word; });
        box.innerHTML = (found.length ? '<span class="muted">메뉴명에서 감지된 기타 알레르기 키워드:</span> ' + found.map(function (w) { return '<span class="tag kw">' + h(w) + '</span>'; }).join('') : '<span class="muted">기타 알레르기 키워드 감지 없음.</span>') +
          ' <span class="inline" style="margin-left:6px"><input type="text" id="me-kw-new" placeholder="새 키워드 (예: 키위)" style="width:140px;height:28px;font-size:12.5px"><button type="button" class="btn sm" id="me-kw-add">목록에 추가</button></span>';
        App.$('#me-kw-add', el).onclick = function () {
          var w = App.$('#me-kw-new', el).value.trim();
          if (!w) return;
          var b = this; App.busy(b, true);
          App.api('apiAddKeyword', w, '').then(function (r) { App.state.boot.keywordList = r.keywordList; App.toast('"' + w + '" 을(를) 기타 알레르기 목록에 추가했습니다', 'ok'); renderPreview(); })
            .catch(function (err) { App.toast(err.message, 'danger'); App.busy(b, false); });
        };
      }
      function renderPreview() {
        var box = App.$('#me-preview', el);
        var sel = App.$$('.codes-grid input:checked', el).map(function (i) { return Number(i.value); });
        var name = norm(App.$('#me-name', el).value);
        renderKeywordInfo(name);
        if (!students) return;
        var hits = [];
        students.forEach(function (s) {
          var codeHits = (s.codes || []).filter(function (c) { return sel.indexOf(c) >= 0; }).map(function (c) { return allergens[c] || String(c); });
          var kwHits = (s.keywords || []).filter(function (k) { return terms(k).some(function (t) { var nt = norm(t); return nt && name.indexOf(nt) >= 0; }); });
          if (codeHits.length || kwHits.length) hits.push({ student: s, text: codeHits.concat(kwHits).join(', ') });
        });
        box.innerHTML = App.affectedListHtml(hits, sel.length || name ? '이 조건에 해당하는 학생이 없습니다' : '알레르기 항목을 체크하거나 메뉴명을 입력하세요', { ctx: 'menu-preview', noEdit: true });
        var scroll = App.$('.list-scroll', box); if (scroll) scroll.style.maxHeight = '240px';
      }
      App.cached('students', function () { return App.api('apiStudents'); }).then(function (data) {
        students = data.students.filter(function (s) { return s.active && (!s.schoolYear || s.schoolYear === data.schoolYear); });
        renderPreview();
      }).catch(function (e) { App.$('#me-preview', el).innerHTML = '<div class="notice danger small">' + h(e.message) + '</div>'; });
      App.on(el, 'change', function (e) { if (e.target.closest('.codes-grid')) renderPreview(); });
      var nameTimer;
      App.$('#me-name', el).addEventListener('input', function () { clearTimeout(nameTimer); nameTimer = setTimeout(renderPreview, 250); });
      App.$('#me-save', el).addEventListener('click', function () {
        var btn = this;
        var sel = App.$$('.codes-grid input:checked', el).map(function (i) { return Number(i.value); });
        var payload = { _row: m._row || null, date: App.$('#me-date', el).value, mealType: App.$('#me-type', el).value, name: App.$('#me-name', el).value.trim(), codes: sel, checkedNone: App.$('#me-none', el).checked };
        if (!payload.name) { App.$('#me-err', el).textContent = '메뉴명을 입력하세요'; return; }
        App.busy(btn, true);
        App.api('apiSaveMenu', payload).then(function () { App.changed('meals'); App.toast('저장했습니다', 'ok'); api.close(); if (onSaved) onSaved(); })
          .catch(function (e) { App.$('#me-err', el).textContent = e.message; App.busy(btn, false); });
      });
    },
  });
  if (!modal) App.toast('먼저 열려 있는 창을 닫아 주세요');
};
</script>
