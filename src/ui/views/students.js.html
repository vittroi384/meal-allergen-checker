<script>
/* 학생 관리: 목록/검색/추가/수정/비활성, 일괄 업로드(xlsx·붙여넣기 → 미리보기 → 병합), 양식·명단 다운로드 */
App.views.students = {
  title: '학생 관리',
  render: function (el) {
    var h = App.h;
    var self = this;
    var filter = self._filter || { q: '', grade: '', classNo: '', activeOnly: true };
    self._filter = filter;
    return App.cached('students', function () { return App.api('apiStudents'); }).then(function (data) {
      var all = data.students;
      var grades = {}, classes = {};
      all.forEach(function (s) { grades[s.grade] = true; if (!filter.grade || Number(filter.grade) === s.grade) classes[s.classNo] = true; });
      var list = all.filter(function (s) {
        if (filter.activeOnly && (!s.active || (s.schoolYear && s.schoolYear !== data.schoolYear))) return false;
        if (filter.grade && s.grade !== Number(filter.grade)) return false;
        if (filter.classNo && s.classNo !== Number(filter.classNo)) return false;
        if (filter.q) {
          var q = filter.q.replace(/\s+/g, '').toLowerCase();
          var hay = (s.label + s.codeNames.join('') + s.keywords.join('') + s.note + s.parentEmail + s.parentPhone + s.teacherName + s.teacherPhone).replace(/\s+/g, '').toLowerCase();
          if (hay.indexOf(q) < 0) return false;
        }
        return true;
      });
      var conflicts = data.teacherConflicts || [];
      el.innerHTML =
        '<div class="page-head"><div><h2>학생 관리</h2><div class="sub">' + data.schoolYear + '학년도 · 전체 ' + all.length + '명 · 표시 ' + list.length + '명</div></div>' +
        '<div class="actions"><button class="btn" id="dl-template">업로드 양식 다운로드</button><button class="btn" id="dl-list">명단 xlsx</button><button class="btn" id="upload">일괄 업로드</button><button class="btn primary" id="add">+ 학생 추가</button></div></div>' +
        (conflicts.length ? '<div class="notice warn" style="margin-bottom:14px"><b>담임 정보가 반 안에서 다릅니다:</b> ' + conflicts.map(function (c) { return c.grade + '-' + c.classNo + ' (' + h(c.combos.map(function (x) { return [x.name || '(이름 없음)', x.phone].filter(Boolean).join(' ') + ' ' + x.count + '명'; }).join(' / ')) + ')'; }).join(', ') + ' — 같은 반은 담임이름·전화번호가 같아야 합니다.</div>' : '') +
        '<div class="card"><div class="toolbar" style="margin-bottom:12px">' +
        '<input type="text" id="q" placeholder="이름, 학년-반, 알레르기, 담임 검색" value="' + h(filter.q) + '" style="width:260px;max-width:100%">' +
        '<select id="grade"><option value="">전체 학년</option>' + Object.keys(grades).sort(function (a, b) { return a - b; }).map(function (g) { return '<option value="' + g + '"' + (String(filter.grade) === g ? ' selected' : '') + '>' + g + '학년</option>'; }).join('') + '</select>' +
        '<select id="class"><option value="">전체 반</option>' + Object.keys(classes).sort(function (a, b) { return a - b; }).map(function (c) { return '<option value="' + c + '"' + (String(filter.classNo) === c ? ' selected' : '') + '>' + c + '반</option>'; }).join('') + '</select>' +
        '<label class="check"><input type="checkbox" id="active-only"' + (filter.activeOnly ? ' checked' : '') + '> 현재 학년도 사용 중만</label></div>' +
        '<div class="table-wrap"><table><thead><tr><th>학년-반</th><th>이름</th><th>담임</th><th>알레르기</th><th>기타</th><th>학부모알림</th><th>비고</th><th class="center">사용</th><th></th></tr></thead><tbody>' +
        (list.length ? list.map(function (s) {
          var tconf = s.teacher && s.teacher.conflict;
          var contact = s.parentNotify === '문자' ? s.parentPhone : s.parentEmail;
          return '<tr' + (s.active ? '' : ' style="opacity:.55"') + '><td>' + s.grade + '-' + s.classNo + (s.schoolYear && s.schoolYear !== data.schoolYear ? ' <span class="badge gray">' + s.schoolYear + '</span>' : '') + '</td><td class="name">' + h(s.name) + '</td>' +
            '<td>' + (s.teacherName || s.teacherPhone ? h(s.teacherName) + (s.teacherPhone ? '<span class="sub-contact">' + h(s.teacherPhone) + '</span>' : '') : '<span class="muted">미등록</span>') + (tconf ? ' <span class="badge warn tiny" title="같은 반의 담임 정보가 서로 다릅니다">불일치</span>' : '') + '</td>' +
            '<td class="chips">' + App.codeTags(s.codes) + '</td><td class="chips">' + s.keywords.map(function (k) { return '<span class="tag kw">' + h(k) + '</span>'; }).join('') + '</td>' +
            '<td>' + (s.parentNotify === '없음' ? '<span class="muted">없음</span>' : '<span class="badge blue">' + h(s.parentNotify) + '</span><span class="sub-contact">' + h(contact) + '</span>') + '</td>' +
            '<td class="wrap small">' + h(s.note) + '</td><td class="center">' + (s.active ? '<span class="badge ok">사용</span>' : '<span class="badge gray">중지</span>') + '</td>' +
            '<td class="nowrap"><button class="btn sm ghost" data-edit="' + s._row + '">수정</button><button class="btn sm ghost" data-toggle="' + s._row + '" data-active="' + (s.active ? 1 : 0) + '">' + (s.active ? '중지' : '사용') + '</button></td></tr>';
        }).join('') : '<tr><td colspan="9" class="empty">' + (all.length ? '조건에 맞는 학생이 없습니다' : '등록된 학생이 없습니다. "학생 추가" 또는 "일괄 업로드"로 시작하세요.') + '</td></tr>') +
        '</tbody></table></div></div>';

      var byRow = {};
      all.forEach(function (s) { byRow[s._row] = s; });
      var reload = function () { App.changed('students'); return self.render(el); };
      var refilter = function () { return self.render(el); };
      var applyFilter = function () { filter.q = App.$('#q').value; filter.grade = App.$('#grade').value; filter.classNo = App.$('#class').value; filter.activeOnly = App.$('#active-only').checked; refilter(); };
      var qTimer;
      App.$('#q').oninput = function () { clearTimeout(qTimer); qTimer = setTimeout(applyFilter, 250); };
      App.$('#grade').onchange = function () { filter.classNo = ''; applyFilter(); };
      App.$('#class').onchange = applyFilter;
      App.$('#active-only').onchange = applyFilter;
      App.$('#add').onclick = function () { App.studentEditor({}, data.schoolYear, reload); };
      App.$('#upload').onclick = function () { App.studentUpload(reload); };
      App.$('#dl-template').onclick = function (e) { App.downloadXlsx('template', {}, e.currentTarget); };
      App.$('#dl-list').onclick = function (e) { App.downloadXlsx('students', { grade: filter.grade, classNo: filter.classNo, activeOnly: filter.activeOnly }, e.currentTarget); };
      App.on(el, 'click', function (e) {
        var b = e.target.closest('button');
        if (!b || !el.contains(b)) return;
        if (b.dataset.edit) App.studentEditor(byRow[b.dataset.edit], data.schoolYear, reload);
        if (b.dataset.toggle) {
          var s = byRow[b.dataset.toggle];
          var toActive = b.dataset.active !== '1';
          App.confirm(toActive ? '사용으로 변경' : '사용 중지', s.label + ' 학생을 ' + (toActive ? '판별 대상에 포함' : '판별·알림에서 제외') + '할까요? (데이터는 삭제되지 않습니다)', '확인').then(function (ok) {
            if (!ok) return;
            App.api('apiSetStudentActive', s._row, toActive).then(function () { App.toast('변경했습니다', 'ok'); reload(); }).catch(function (err) { App.toast(err.message, 'danger'); });
          });
        }
      });
      if (document.activeElement === document.body && filter.q) { var q = App.$('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    });
  },
};

App.studentEditor = function (s, schoolYear, onSaved) {
  var h = App.h;
  var allergens = App.state.boot.allergens;
  var codes = s.codes || [];
  var body = '<div class="form-grid">' +
    '<div class="field"><label>학년도</label><input type="number" id="se-year" value="' + h(s.schoolYear || schoolYear) + '" min="2000" max="2100"></div>' +
    '<div class="field"><label>이름 *</label><input type="text" id="se-name" value="' + h(s.name || '') + '"></div>' +
    '<div class="field"><label>학년 *</label><input type="number" id="se-grade" value="' + h(s.grade || '') + '" min="1" max="6"></div>' +
    '<div class="field"><label>반 *</label><input type="number" id="se-class" value="' + h(s.classNo || '') + '" min="1"></div>' +
    '<div class="field"><label>담임 이름</label><input type="text" id="se-tname" value="' + h(s.teacherName || '') + '"><span class="help">같은 반은 같은 담임 정보여야 합니다</span></div>' +
    '<div class="field"><label>담임 전화번호</label><input type="tel" id="se-tphone" value="' + h(s.teacherPhone || '') + '" placeholder="010-0000-0000 / 02-000-0000"></div>' +
    '<div class="field full"><label>알레르기 유발식품 (19종)</label><div class="codes-grid">' +
    Object.keys(allergens).map(function (c) { return '<label class="check"><input type="checkbox" value="' + c + '"' + (codes.indexOf(Number(c)) >= 0 ? ' checked' : '') + '> ' + c + '. ' + h(allergens[c]) + '</label>'; }).join('') + '</div></div>' +
    '<div class="field full"><label>기타 알레르기 (키워드, 쉼표 구분)</label><input type="text" id="se-kw" value="' + h((s.keywords || []).join(', ')) + '" placeholder="예: 키위, 망고"><span class="help">메뉴명에 키워드가 포함되면 해당으로 판별합니다</span></div>' +
    '<div class="field full"><label>비고</label><input type="text" id="se-note" value="' + h(s.note || '') + '" placeholder="동명이인 구분 등"></div>' +
    '<div class="field"><label>학부모 알림</label><select id="se-notify">' + ['없음', '이메일', '문자'].map(function (v) { return '<option' + ((s.parentNotify || '없음') === v ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select><span class="help">전체 학부모 알림이 설정에서 켜져 있을 때만 발송됩니다</span></div>' +
    '<div class="field"><label>사용여부</label><label class="check" style="margin-top:8px"><input type="checkbox" id="se-active"' + (s.active !== false ? ' checked' : '') + '> 판별·알림 대상에 포함</label></div>' +
    '<div class="field"><label>학부모 이메일</label><input type="email" id="se-email" value="' + h(s.parentEmail || '') + '"></div>' +
    '<div class="field"><label>학부모 연락처</label><input type="tel" id="se-phone" value="' + h(s.parentPhone || '') + '" placeholder="010-0000-0000"></div>' +
    '</div><div id="se-err" class="error-text" style="margin-top:8px;white-space:pre-line"></div>';
  var modal = App.modal({
    title: s._row ? '학생 수정 — ' + s.label : '학생 추가', body: body,
    footer: '<button class="btn" data-close>취소</button><button class="btn primary" id="se-save">저장</button>',
    onMount: function (el, api) {
      App.$('#se-save', el).addEventListener('click', function () {
        var btn = this;
        var payload = {
          _row: s._row || null, schoolYear: App.$('#se-year', el).value, name: App.$('#se-name', el).value, grade: App.$('#se-grade', el).value, classNo: App.$('#se-class', el).value,
          teacherName: App.$('#se-tname', el).value, teacherPhone: App.$('#se-tphone', el).value,
          codes: App.$$('.codes-grid input:checked', el).map(function (i) { return Number(i.value); }), keywords: App.$('#se-kw', el).value, note: App.$('#se-note', el).value,
          parentNotify: App.$('#se-notify', el).value, parentEmail: App.$('#se-email', el).value, parentPhone: App.$('#se-phone', el).value, active: App.$('#se-active', el).checked,
        };
        App.busy(btn, true);
        App.api('apiSaveStudent', payload).then(function (r) {
          if (!r.ok) { App.$('#se-err', el).textContent = r.errors.join('\n'); App.busy(btn, false); return; }
          App.toast('저장했습니다', 'ok');
          (r.warnings || []).forEach(function (w) { App.toast('경고: ' + w, 'danger'); });
          api.close(); if (onSaved) onSaved();
        }).catch(function (e) { App.$('#se-err', el).textContent = e.message; App.busy(btn, false); });
      });
    },
  });
  if (!modal) App.toast('먼저 열려 있는 창을 닫아 주세요');
};

/**
 * 업로드 모달 (파일/붙여넣기 → 미리보기 → 반영).
 * cfg = { title, note, previewApi, applyApi, columns(row) → td html 배열, headers[], pasteHint, fieldLabel, onDone }
 */
App.uploadModal = function (cfg) {
  var h = App.h;
  var rawRows = null, plan = null;
  var body =
    '<div class="tabs"><button class="active" data-tab="file">xlsx 파일</button><button data-tab="paste">엑셀에서 붙여넣기</button></div>' +
    '<div id="tab-file"><label class="dropzone" id="dz"><input type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><div>📄 여기를 눌러 .xlsx 파일을 선택하거나 끌어다 놓으세요</div><div class="small" style="margin-top:4px">첫 번째 시트를 읽습니다. 헤더는 양식과 같게 (양식 다운로드 참고)</div></label><div id="file-name" class="small muted" style="margin-top:6px"></div></div>' +
    '<div id="tab-paste" hidden><textarea id="paste" placeholder="엑셀에서 헤더 포함 범위를 복사한 뒤 여기에 붙여넣기 (Ctrl+V)"></textarea><div class="small muted">' + h(cfg.pasteHint || '') + '</div></div>' +
    '<div id="preview" style="margin-top:14px"></div><div id="up-err" class="error-text" style="margin-top:8px"></div>';
  var modal = App.modal({
    title: cfg.title, body: body, wide: true,
    footer: '<span class="left small muted">' + h(cfg.note || '') + '</span><button class="btn" data-close>닫기</button><button class="btn" id="up-preview">미리보기</button><button class="btn primary" id="up-apply" disabled>반영</button>',
    onMount: function (el, api) {
      var mode = 'file', pickedFile = null;
      App.$$('.tabs button', el).forEach(function (b) {
        b.onclick = function () { App.$$('.tabs button', el).forEach(function (x) { x.classList.toggle('active', x === b); }); mode = b.dataset.tab; App.$('#tab-file', el).hidden = mode !== 'file'; App.$('#tab-paste', el).hidden = mode !== 'paste'; };
      });
      var fileInput = App.$('#file', el), dz = App.$('#dz', el);
      fileInput.onchange = function () { pickedFile = fileInput.files[0]; App.$('#file-name', el).textContent = pickedFile ? pickedFile.name + ' (' + Math.round(pickedFile.size / 1024) + ' KB)' : ''; };
      ['dragenter', 'dragover'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('over'); }); });
      dz.addEventListener('drop', function (e) { if (e.dataTransfer.files[0]) { pickedFile = e.dataTransfer.files[0]; App.$('#file-name', el).textContent = pickedFile.name; } });

      function renderPreview() {
        var filterMode = 'all';
        var box = App.$('#preview', el);
        function draw() {
          var rows = plan.rows.filter(function (r) { return filterMode === 'all' || (filterMode === 'error' && r.status === '오류') || (filterMode === 'warn' && r.warnings && r.warnings.length); });
          var s = plan.summary;
          box.innerHTML = '<div class="toolbar" style="margin-bottom:8px"><span class="badge ok">추가 ' + s.add + '</span><span class="badge blue">수정 ' + s.update + '</span><span class="badge gray">변경 없음 ' + s.unchanged + '</span><span class="badge danger">오류 ' + s.error + '</span>' + (s.warning ? '<span class="badge warn">경고 ' + s.warning + '</span>' : '') +
            '<select id="pv-filter" style="margin-left:auto"><option value="all"' + (filterMode === 'all' ? ' selected' : '') + '>전체 보기</option><option value="error"' + (filterMode === 'error' ? ' selected' : '') + '>오류 행만</option><option value="warn"' + (filterMode === 'warn' ? ' selected' : '') + '>경고 행만</option></select></div>' +
            (s.error ? '<div class="notice danger small" style="margin-bottom:8px">오류가 있는 행이 있어 반영할 수 없습니다. 원본을 고쳐 다시 미리보기 하세요.</div>' : '<div class="notice ok small" style="margin-bottom:8px">오류 없음 — "반영"을 누르면 저장됩니다.' + (s.warning ? ' 경고 ' + s.warning + '건은 반영을 막지 않지만 확인하세요.' : '') + '</div>') +
            '<div class="table-wrap" style="max-height:380px;overflow:auto"><table><thead><tr><th>행</th><th>상태</th>' + cfg.headers.map(function (x) { return '<th>' + h(x) + '</th>'; }).join('') + '<th>내용</th></tr></thead><tbody>' +
            rows.map(function (r) {
              var cls = r.status === '오류' ? 'row-error' : r.status === '추가' ? 'row-add' : r.status === '수정' ? 'row-update' : '';
              var badge = r.status === '오류' ? 'danger' : r.status === '추가' ? 'ok' : r.status === '수정' ? 'blue' : 'gray';
              var detail = r.status === '오류' ? '<span class="error-text">' + h(r.errors.join('; ')) + '</span>' : r.status === '수정' ? '<span class="small muted">변경: ' + h(r.changedFields.map(cfg.fieldLabel || function (f) { return f; }).join(', ')) + '</span>' : '';
              if (r.warnings && r.warnings.length) detail += (detail ? '<br>' : '') + '<span class="small" style="color:var(--warn)">⚠ ' + h(r.warnings.join(' / ')) + '</span>';
              var classes = cfg.colClasses || [];
              return '<tr class="' + cls + '"><td>' + r._row + '</td><td><span class="badge ' + badge + '">' + r.status + '</span></td>' + cfg.columns(r).map(function (c, i) { return '<td class="' + (classes[i] || '') + '">' + c + '</td>'; }).join('') + '<td class="wrap">' + detail + '</td></tr>';
            }).join('') + '</tbody></table></div>';
          App.$('#pv-filter', el).onchange = function () { filterMode = this.value; draw(); };
        }
        draw();
        App.$('#up-apply', el).disabled = !plan.ok;
      }
      App.$('#up-preview', el).onclick = function () {
        var btn = this; App.$('#up-err', el).textContent = ''; App.$('#up-apply', el).disabled = true;
        var input;
        if (mode === 'file') {
          if (!pickedFile) { App.$('#up-err', el).textContent = '파일을 선택하세요'; return; }
          if (pickedFile.size > 5 * 1024 * 1024) { App.$('#up-err', el).textContent = '5MB 이하 파일만 가능합니다'; return; }
          input = App.readFileBase64(pickedFile).then(function (b64) { return { base64: b64, filename: pickedFile.name }; });
        } else {
          var text = App.$('#paste', el).value;
          if (!text.trim()) { App.$('#up-err', el).textContent = '붙여넣은 내용이 없습니다'; return; }
          input = Promise.resolve({ tsv: text });
        }
        App.busy(btn, true);
        input.then(function (inp) { return App.api(cfg.previewApi, inp); }).then(function (r) { rawRows = r.rawRows; plan = r.plan; renderPreview(); })
          .catch(function (e) { App.$('#up-err', el).textContent = e.message; }).then(function () { App.busy(btn, false); });
      };
      App.$('#up-apply', el).onclick = function () {
        var btn = this;
        if (!plan || !plan.ok) return;
        App.confirm('반영', '추가 ' + plan.summary.add + '건, 수정 ' + plan.summary.update + '건을 반영할까요?' + (plan.summary.warning ? '\n(경고 ' + plan.summary.warning + '건 포함)' : ''), '반영').then(function (ok) {
          if (!ok) return;
          App.busy(btn, true);
          App.api(cfg.applyApi, rawRows).then(function (r) {
            if (!r.ok) { App.$('#up-err', el).textContent = r.error; if (r.plan) { plan = r.plan; renderPreview(); } App.busy(btn, false); return; }
            App.toast('반영 완료: 추가 ' + r.added + ', 수정 ' + r.updated, 'ok'); api.close(); if (cfg.onDone) cfg.onDone();
          }).catch(function (e) { App.$('#up-err', el).textContent = e.message; App.busy(btn, false); });
        });
      };
    },
  });
  if (!modal) App.toast('먼저 열려 있는 창을 닫아 주세요');
};

App.studentUpload = function (onDone) {
  var h = App.h;
  App.uploadModal({
    title: '학생 일괄 업로드',
    note: '기존 학생과 학년·반·이름이 같으면 수정, 아니면 추가. 삭제는 하지 않습니다. 동명이인·담임 불일치는 경고로 표시됩니다.',
    pasteHint: '헤더가 없으면 학생 시트 열 순서(학년도, 학년, 반, 이름, 담임이름, 담임전화번호, 알레르기코드, 기타알레르기, 비고, 학부모이메일, 학부모연락처, 학부모알림, 사용여부)로 간주합니다',
    previewApi: 'apiPreviewStudentUpload', applyApi: 'apiApplyStudentUpload',
