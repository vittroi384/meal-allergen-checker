<script>
/**
 * 인쇄: 기간(오늘/이번 주/이번 달/직접) · 학년/반 · 모드(전체 연속 기본 / 반별 분리) · 방향(세로/가로).
 * 화면의 A4 미리보기(.print-doc)가 곧 인쇄 결과. 브라우저 머리글/바닥글 대신 문서 안에 제목·기간·출력일, @page 하단에 페이지 번호.
 */
App.views.print = {
  title: '인쇄',
  render: function (el, r) {
    var h = App.h;
    var p = r.params || {};
    var valid = function (s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); };
    var t = App.today();
    // "이번 주" 프리셋 = 이번 주 월~금 (일요일에는 지난 월요일 기준)
    var dw = App.dow(t);
    var mon = App.addDays(t, dw === 0 ? -6 : 1 - dw);
    // 그 달의 마지막 날 (UTC 로 계산해 시간대 영향 제거)
    var monthEnd = function (d) { var pp = d.slice(0, 7).split('-').map(Number); return d.slice(0, 7) + '-' + App.pad(new Date(Date.UTC(pp[0], pp[1], 0)).getUTCDate()); };
    var presets = { today: [t, t], week: [mon, App.addDays(mon, 4)], month: [t.slice(0, 7) + '-01', monthEnd(t)] };
    var start = valid(p.start) ? p.start : presets.week[0];
    var end = valid(p.end) ? p.end : presets.week[1];
    var preset = Object.keys(presets).filter(function (k) { return presets[k][0] === start && presets[k][1] === end; })[0] || 'custom';
    var grade = p.grade || '', classNo = p.classNo || '';
    var mode = p.mode === 'sep' ? 'sep' : 'cont';
    var orient = p.orient === 'l' ? 'l' : 'p';

    // @page 는 클래스로 못 바꾸므로 style 태그를 갱신 (용지·여백·하단 페이지 번호)
    var ps = document.getElementById('print-page-style');
    if (!ps) { ps = document.createElement('style'); ps.id = 'print-page-style'; document.head.appendChild(ps); }
    ps.textContent = '@page { size: A4 ' + (orient === 'l' ? 'landscape' : 'portrait') + '; margin: 16mm 12mm 18mm; @bottom-center { content: counter(page) " / " counter(pages); font-size: 9pt; color: #6b7280; } }';

    // 세그먼트 버튼 그룹 HTML (현재 선택 값에 on 클래스)
    var seg = function (id, items, cur) {
      return '<span class="seg" id="' + id + '">' + items.map(function (it) { return '<button type="button" class="' + (it[0] === cur ? 'on' : '') + '" data-v="' + it[0] + '">' + it[1] + '</button>'; }).join('') + '</span>';
    };
    el.innerHTML =
      '<div class="page-head no-print"><div><h2>인쇄</h2><div class="sub">급식 알레르기 주의 학생 명단 — 아래 미리보기가 A4 인쇄 결과와 같습니다</div></div>' +
      '<div class="actions" style="align-items:center"><span class="small muted" style="max-width:360px;text-align:right;line-height:1.35">반드시 이 <b>🖨 인쇄</b> 버튼으로 (Ctrl+P 는 화면이 잘려 나옴). 인쇄 창에서 <b>설정 더보기 → 머리글 및 바닥글</b> 체크 해제</span>' +
      '<button class="btn primary" id="p-print">🖨 인쇄</button><button class="btn" id="p-dl">xlsx 다운로드</button></div></div>' +
      '<div class="card no-print"><div class="toolbar" style="row-gap:10px">' +
      '<label class="small">기간</label>' + seg('p-range', [['today', '오늘'], ['week', '이번 주'], ['month', '이번 달'], ['custom', '직접 지정']], preset) +
      '<input type="date" id="p-start" value="' + start + '"> <span class="muted">~</span> <input type="date" id="p-end" value="' + end + '">' +
      '<label class="small" style="margin-left:8px">학년</label><input type="number" id="p-grade" value="' + h(grade) + '" min="1" style="width:72px" placeholder="전체">' +
      '<label class="small">반</label><input type="number" id="p-class" value="' + h(classNo) + '" min="1" style="width:72px" placeholder="전체">' +
      '</div><div class="toolbar" style="margin-top:10px;row-gap:10px">' +
      '<label class="small">모드</label>' + seg('p-mode', [['cont', '전체 연속 (영양사용)'], ['sep', '반별 분리 (담임 배부용, 반마다 새 페이지)']], mode) +
      '<label class="small" style="margin-left:8px">방향</label>' + seg('p-orient', [['p', '세로'], ['l', '가로']], orient) +
      '<button class="btn primary" id="p-go" style="margin-left:auto">조회</button></div>' +
      '<div class="notice info small" style="margin-top:12px">인쇄 대화상자에서 <b>"머리글 및 바닥글" 끄기</b>, <b>"배경 그래픽" 켜기</b>, 용지 <b>A4</b>, 방향은 위에서 고른 것과 같게 두세요. 제목·기간·출력일은 문서 안에, 페이지 번호는 각 장 하단에 자동으로 들어갑니다.</div></div>' +
      '<div id="p-body"><div class="loading"><span class="spinner"></span></div></div>';

    // 현재 입력값을 URL 쿼리로 반영 → 라우터가 이 뷰를 새 조건으로 다시 렌더
    var nav = function () {
      App.go('print?start=' + App.$('#p-start').value + '&end=' + App.$('#p-end').value + '&grade=' + App.$('#p-grade').value + '&classNo=' + App.$('#p-class').value + '&mode=' + mode + '&orient=' + orient);
    };
    App.$('#p-go').onclick = nav;
    App.$('#p-print').onclick = function () { window.print(); };
    App.$('#p-dl').onclick = function (e) { App.downloadXlsx('class', { start: start, end: end, grade: grade, classNo: classNo }, e.currentTarget); };
    // 세그먼트 클릭 위임: 기간 프리셋은 날짜 입력을 채우고 조회, 모드·방향은 즉시 URL 갱신
    App.on(el, 'click', function (e) {
      var b = e.target.closest('.seg button');
      if (!b || !el.contains(b)) return;
      var id = b.parentNode.id, v = b.dataset.v;
      if (id === 'p-range') {
        if (v === 'custom') { App.$('#p-start').focus(); return; }
        App.$('#p-start').value = presets[v][0]; App.$('#p-end').value = presets[v][1]; nav();
      } else if (id === 'p-mode') { mode = v; nav(); } else if (id === 'p-orient') { orient = v; nav(); }
    });

    var school = (App.state.boot && App.state.boot.settings['학교명']) || '';
    var periodText = App.fmtDate(start) + ' ~ ' + App.fmtDate(end) + ' (' + start.slice(0, 4) + '년)';
    // 문서 머리(제목·기간·출력일) — 브라우저 머리글 대신 문서 안에 넣어 어느 브라우저에서나 같게 인쇄된다
    var docHead = function (sub) {
      return '<div class="pd-head"><div class="pd-title">' + h(school ? school + ' ' : '') + '급식 알레르기 주의 학생 명단</div>' +
        '<div class="pd-sub">기간 ' + h(periodText) + (sub ? ' · ' + sub : '') + ' · 출력 ' + h(App.today()) + '</div></div>';
    };
    // 반 제목(caption) 내용: 학년-반 · 담임 · 건수
    var classHead = function (c) {
      return '<b>' + c.grade + '학년 ' + c.classNo + '반</b><span>' + h(c.teacherLabel || '') + '</span><span class="n">' + c.rows.length + '건</span>';
    };
    // 표 한 행: 날짜·끼니·이름·못 먹는 메뉴(원인)·확인란(수기 체크용 빈 칸)
    var rowHtml = function (x) { return '<tr><td class="c">' + h(x.label) + '</td><td class="c">' + h(x.mealType) + '</td><td class="c">' + h(x.name) + '</td><td class="menu">' + h(x.text) + '</td><td></td></tr>'; };
    /**
     * 반 표. 반 제목은 <caption>(break-after: avoid), 첫 2행은 별도 <tbody class="pd-first">(break-inside: avoid)
     * → 제목이 페이지 끝에 혼자 남지 않고 첫 2행과 함께 넘어간다. thead 는 table-header-group 으로 페이지마다 반복.
     */
    var table = function (c, withCaption) {
      return '<table class="pd-table"><colgroup><col style="width:23mm"><col style="width:12mm"><col style="width:20mm"><col><col style="width:14mm"></colgroup>' +
        (withCaption ? '<caption class="pd-class">' + classHead(c) + '</caption>' : '') +
        '<thead><tr><th>날짜</th><th>끼니</th><th>이름</th><th>못 먹는 메뉴 (원인)</th><th>확인</th></tr></thead>' +
        '<tbody class="pd-first">' + c.rows.slice(0, 2).map(rowHtml).join('') + '</tbody>' +
        (c.rows.length > 2 ? '<tbody>' + c.rows.slice(2).map(rowHtml).join('') + '</tbody>' : '') +
        '<tfoot><tr><td colspan="5"></td></tr></tfoot>' +   // 쪽마다 반복되어 표 아래를 닫는 선
        '</table>';
    };

    // 데이터 조회(apiPrintData) 후 A4 미리보기(.print-doc) 생성 — 이 DOM 이 그대로 인쇄된다
    return App.api('apiPrintData', { start: start, end: end, grade: grade, classNo: classNo }).then(function (d) {
      var body = App.$('#p-body');
      if (!d.classes.length) { body.innerHTML = '<div class="print-doc ' + orient + '">' + docHead('') + '<div class="empty">이 기간에 해당 학생이 없습니다</div></div>'; return; }
      var total = d.classes.reduce(function (n, c) { return n + c.rows.length; }, 0);
      if (mode === 'sep') {
        // 반마다 새 페이지: 각 장에 제목·기간·반·담임
        body.innerHTML = d.classes.map(function (c) {
          return '<div class="print-doc ' + orient + ' pd-page">' + docHead(c.grade + '학년 ' + c.classNo + '반' + (c.teacherLabel ? ' · ' + h(c.teacherLabel) : '') + ' · ' + c.rows.length + '건') + table(c, false) + '</div>';
        }).join('');
      } else {
        // 전체 연속: 반 구분선(caption)만 두고 이어서
        body.innerHTML = '<div class="print-doc ' + orient + '">' + docHead('전체 ' + d.classes.length + '개 반 · ' + total + '건') +
          d.classes.map(function (c) { return '<section class="pd-sec">' + table(c, true) + '</section>'; }).join('') + '</div>';
      }
    }).catch(function (e) { App.$('#p-body').innerHTML = '<div class="card"><div class="notice danger">' + h(e.message) + '</div></div>'; });
  },
};
</script>
