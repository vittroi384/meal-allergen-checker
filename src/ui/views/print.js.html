<script>
/* 반별 인쇄용: 기간·반 선택 → 반마다 한 페이지 표 */
App.views.print = {
  title: '반별 인쇄',
  render: function (el, r) {
    var h = App.h;
    var self = this;
    var p = r.params || {};
    var t = App.today();
    var dw = App.dow(t);
    var mon = App.addDays(t, dw === 0 ? -6 : 1 - dw);
    var start = /^\d{4}-\d{2}-\d{2}$/.test(p.start) ? p.start : mon;
    var end = /^\d{4}-\d{2}-\d{2}$/.test(p.end) ? p.end : App.addDays(mon, 4);
    var grade = p.grade || '', classNo = p.classNo || '';
    var head =
      '<div class="page-head no-print"><div><h2>반별 인쇄용 목록</h2><div class="sub">담임에게 나눠줄 수 있도록 반마다 한 페이지로 출력됩니다</div></div></div>' +
      '<div class="card no-print"><div class="inline">' +
      '<label class="small">기간</label><input type="date" id="p-start" value="' + start + '" style="width:auto"> ~ <input type="date" id="p-end" value="' + end + '" style="width:auto">' +
      '<button class="btn sm" id="p-week">이번 주</button><button class="btn sm" id="p-month">이번 달</button>' +
      '<label class="small" style="margin-left:8px">학년</label><input type="number" id="p-grade" value="' + h(grade) + '" min="1" max="6" style="width:70px" placeholder="전체">' +
      '<label class="small">반</label><input type="number" id="p-class" value="' + h(classNo) + '" min="1" style="width:70px" placeholder="전체">' +
      '<button class="btn primary" id="p-go">조회</button><button class="btn" id="p-print">🖨 인쇄</button><button class="btn" id="p-dl">xlsx 다운로드</button></div></div>';
    el.innerHTML = head + '<div id="p-body"><div class="loading"><span class="spinner"></span></div></div>';
    var nav = function () { App.go('print?start=' + App.$('#p-start').value + '&end=' + App.$('#p-end').value + '&grade=' + App.$('#p-grade').value + '&classNo=' + App.$('#p-class').value); };
    App.$('#p-go').onclick = nav;
    App.$('#p-week').onclick = function () { App.$('#p-start').value = mon; App.$('#p-end').value = App.addDays(mon, 4); nav(); };
    App.$('#p-month').onclick = function () { var ym = t.slice(0, 7); var pp = ym.split('-').map(Number); var last = new Date(Date.UTC(pp[0], pp[1], 0)).getUTCDate(); App.$('#p-start').value = ym + '-01'; App.$('#p-end').value = ym + '-' + App.pad(last); nav(); };
    App.$('#p-print').onclick = function () { window.print(); };
    App.$('#p-dl').onclick = function (e) { App.downloadXlsx('class', { start: start, end: end, grade: grade, classNo: classNo }, e.currentTarget); };

    return App.api('apiPrintData', { start: start, end: end, grade: grade, classNo: classNo }).then(function (d) {
      var body = App.$('#p-body');
      if (!d.classes.length) { body.innerHTML = '<div class="card"><div class="empty">' + App.fmtDate(start) + ' ~ ' + App.fmtDate(end) + ' 기간에 해당 학생이 없습니다</div></div>'; return; }
      body.innerHTML = d.classes.map(function (c) {
        return '<div class="card print-class"><div class="print-title">' + h(d.schoolName) + ' ' + c.grade + '학년 ' + c.classNo + '반 급식 알레르기 주의 학생</div>' +
          '<div class="print-sub">기간 ' + App.fmtDate(start) + ' ~ ' + App.fmtDate(end) + ' · 총 ' + c.rows.length + '건 · 출력 ' + App.today() + '</div>' +
          '<div class="table-wrap"><table><thead><tr><th class="nowrap">날짜</th><th>끼니</th><th class="nowrap">번호</th><th>이름</th><th>못 먹는 메뉴 (원인)</th><th style="width:90px">확인</th></tr></thead><tbody>' +
          c.rows.map(function (x) { return '<tr><td class="nowrap">' + h(x.label) + '</td><td class="nowrap">' + h(x.mealType) + '</td><td class="center">' + x.number + '</td><td class="nowrap"><b>' + h(x.name) + '</b></td><td>' + h(x.text) + '</td><td></td></tr>'; }).join('') +
          '</tbody></table></div></div>';
      }).join('');
    }).catch(function (e) { App.$('#p-body').innerHTML = '<div class="card"><div class="notice danger">' + h(e.message) + '</div></div>'; });
  },
};
</script>
