<script>
/**
 * 전광판 모드 (#/board): 오늘 해당 학생을 반 단위 행으로 전체 화면 표시.
 * - 행 = 반. 왼쪽 고정 200px 에 "1-1" 크게 + "담임 OOO" 작게, 오른쪽에 그 반 학생 이름 카드(같은 크기)를 가로로 나열, 넘치면 행 안에서 줄바꿈
 * - 반은 학년-반 순. 화면 높이에 맞는 가장 큰 글자 배율을 측정으로 선택, 최소 배율에서도 넘치면 행 단위 페이지 전환(10초, 1초 크로스페이드)
 * - 5분마다 다시 받아 바뀐 행만 교체. Esc 또는 구석 버튼으로 나가기
 * - #/board?demo=normal|none|nomeal|paging : 가상 데이터로 화면 확인 (서버 호출 없음, 상태 표시에 "데모")
 */
App.views.board = {
  title: '전광판',
  skeleton: 'dashboard',
  FLIP_MS: 10000,
  FADE_MS: 1000,
  REFRESH_MS: 5 * 60 * 1000,
  SCALES: [1.7, 1.55, 1.4, 1.25, 1.12, 1.0, 0.9, 0.82, 0.74, 0.66, 0.6, 0.55, 0.5, 0.45],
  MAX_ROWS: 8,

  render: function (el, route) {
    var self = this;
    var h = App.h;
    self.leave();
    document.body.classList.add('board-mode');
    self.page = 0; self.pages = [0]; self.lastHead = ''; self.lastMode = ''; self.data = null; self.flipping = false; self.fitted = false;
    self.demo = route && route.params && route.params.demo ? String(route.params.demo) : '';
    self._timers = [];
    el.innerHTML =
      '<div class="board" id="board">' +
        '<div class="board-head" id="board-head"><span class="loading">불러오는 중…</span></div>' +
        '<div class="board-view" id="board-view">' +
          '<div class="board-flow show" id="board-flow-a"></div><div class="board-flow" id="board-flow-b"></div>' +
          '<div class="board-msg" id="board-msg" hidden></div>' +
        '</div>' +
      '</div>' +
      '<div class="board-foot"><span id="board-status"></span><button class="board-exit" id="board-exit" title="Esc">✕</button></div>';
    self.cur = App.$('#board-flow-a');
    self.alt = App.$('#board-flow-b');
    App.$('#board-exit').onclick = function () { App.go('dashboard'); };

    self._keyHandler = function (e) {
      if (e.key === 'Escape') { App.go('dashboard'); return; }
      if (e.key === 'ArrowRight' || e.key === ' ') self.flip(1);
      if (e.key === 'ArrowLeft') self.flip(-1);
    };
    document.addEventListener('keydown', self._keyHandler);
    var resizeT = null;
    self._onResize = function () { clearTimeout(resizeT); resizeT = setTimeout(function () { self.fit(); }, 200); };
    window.addEventListener('resize', self._onResize);

    var load = function (force) {
      var p;
      if (self.demo) p = Promise.resolve(self.demoData(self.demo));
      else p = force
        ? App.api('apiDashboard').then(function (d) { App.cachePut('dashboard', d); return d; })
        : App.cached('dashboard', function () { return App.api('apiDashboard'); });
      return p.then(function (d) { self.data = d; self.loadedAt = new Date(); self.draw(); })
        .catch(function (e) {
          if (!self.data) App.$('#board-head').innerHTML = '<span class="loading">불러오지 못했습니다 — ' + h(e.message) + '</span>';
          self.status();
        });
    };
    if (!self.demo) self._timers.push(setInterval(function () { load(true); }, self.REFRESH_MS));
    self._timers.push(setInterval(function () { self.tickClock(); }, 15 * 1000));
    return load(false).then(function () {
      // 첫 그리기 직후에는 글꼴·레이아웃이 확정되기 전에 측정될 수 있어 잠시 후 한 번 더 맞춘다
      setTimeout(function () { self.fit(); }, 600);
      try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { self.fit(); }); } catch (e) { /* 무시 */ }
    });
  },

  /** 라우터가 다른 화면으로 넘어갈 때 — 타이머·리스너·body 클래스 정리 */
  leave: function () {
    var self = this;
    document.body.classList.remove('board-mode');
    (self._timers || []).forEach(clearInterval);
    self._timers = [];
    if (self._flipTimer) { clearInterval(self._flipTimer); self._flipTimer = null; }
    if (self._keyHandler) { document.removeEventListener('keydown', self._keyHandler); self._keyHandler = null; }
    if (self._onResize) { window.removeEventListener('resize', self._onResize); self._onResize = null; }
  },

  /** 데모 데이터 (가상 이름). apiDashboard 응답과 같은 모양 */
  demoData: function (kind) {
    var today = App.today();
    var label = App.fmtDateLong(today);
    var SUR = ['김', '이', '박', '최', '정', '강', '조', '윤', '장', '임', '남궁', '선우'];
    var GIV = ['하늘', '서준', '하린', '도윤', '은우', '시우', '건우', '민준', '유나', '채원', '다은', '지호', '수아', '예준', '민서', '지우'];
    var CLASSES = [[1, 1], [1, 2], [2, 1], [2, 2], [3, 1], [3, 3], [4, 1], [4, 2], [5, 1], [6, 1], [6, 2]];
    var TEACHERS = ['박정우', '최은정', '정민호', '한소희', '장윤서', '김태양', '서준혁', '문경수', '오하늘', '신지민', '배수현'];
    var n = kind === 'paging' ? 40 : (kind === 'none' || kind === 'nomeal') ? 0 : 12;
    var classCount = Math.min(CLASSES.length, Math.max(3, Math.ceil(n / 2.4)));
    var students = [];
    for (var i = 0; i < n; i++) {
      var ci = i % classCount;
      students.push({ grade: CLASSES[ci][0], classNo: CLASSES[ci][1], name: SUR[i % SUR.length] + GIV[(i * 7) % GIV.length], teacher: { name: TEACHERS[ci], phone: '', conflict: false } });
    }
    students.sort(function (a, b) { return (a.grade - b.grade) || (a.classNo - b.classNo) || a.name.localeCompare(b.name, 'ko'); });
    var affected = students.map(function (s) {
      s.label = s.grade + '-' + s.classNo + ' ' + s.name;
      return { student: s, items: [{ menu: '돈까스', reasons: ['밀'], text: '돈까스(밀)' }], text: '돈까스(밀)' };
    });
    var menus = kind === 'nomeal' ? [] : [{ name: '돈까스', codes: [6] }, { name: '쌀밥', codes: [] }];
    return { today: today, todayLabel: label, mealTypes: ['중식'],
      todayByType: { '중식': { menus: menus, affected: affected, count: affected.length, uncheckedMenus: [], protected: false } }, failures: [] };
  },

  tickClock: function () {
    var c = App.$('#board-clock');
    if (c) { var d = new Date(); c.textContent = App.pad(d.getHours()) + ':' + App.pad(d.getMinutes()); }
  },

  status: function () {
    var s = App.$('#board-status');
    if (!s) return;
    var parts = [];
    if (this.demo) parts.push('데모 데이터(' + this.demo + ')');
    else if (this.loadedAt) parts.push('갱신 ' + App.pad(this.loadedAt.getHours()) + ':' + App.pad(this.loadedAt.getMinutes()));
    if (this.pages && this.pages.length > 1) parts.push((this.page + 1) + '/' + this.pages.length);
    parts.push('Esc 나가기');
    s.textContent = parts.join(' · ');
  },

  /** 데이터 → 화면. 바뀐 행만 DOM 에 반영한다 */
  draw: function () {
    var self = this;
    var h = App.h;
    var d = self.data;
    if (!d || !App.$('#board')) return;

    var types = d.mealTypes.filter(function (t) { return d.todayByType[t].menus.length > 0; });
    var total = 0;
    types.forEach(function (t) { total += d.todayByType[t].count; });

    // ---- 상단 한 줄 (예외 화면에서도 유지)
    var headHtml = '<span class="date">' + h(d.todayLabel) + '</span>' +
      (types.length
        ? types.map(function (t) { var r = d.todayByType[t]; return '<span class="sep">·</span><span class="meal">' + h(t) + '</span><span class="cnt ' + (r.count ? 'hit' : 'ok') + '">해당 ' + r.count + '명</span>'; }).join('')
        : '<span class="sep">·</span><span class="meal muted">급식 없음</span>') +
      '<span class="clock" id="board-clock"></span>';
    if (headHtml !== self.lastHead) { App.$('#board-head').innerHTML = headHtml; self.lastHead = headHtml; }
    self.tickClock();

    // ---- 예외 화면: 화면 중앙에 크게 + 날짜
    var msg = App.$('#board-msg');
    var mode = !types.length ? 'nomeal' : (!total ? 'none' : 'list');
    if (mode !== 'list') {
      var msgHtml = (mode === 'nomeal' ? '<div class="big muted">급식 없음</div>' : '<div class="big ok">오늘 해당 학생 없음</div>') +
        '<div class="date">' + h(d.todayLabel) + (types.length ? ' · ' + h(types.join(' · ')) : '') + '</div>';
      if (msg.innerHTML !== msgHtml) msg.innerHTML = msgHtml;
      msg.hidden = false;
      self.cur.classList.remove('show'); self.alt.classList.remove('show');
      self.pages = [0]; self.page = 0;
      if (self._flipTimer) { clearInterval(self._flipTimer); self._flipTimer = null; }
      self.lastMode = mode;
      self.status();
      return;
    }
    msg.hidden = true;
    if (self.lastMode !== 'list') self.cur.classList.add('show');
    self.lastMode = mode;

    // ---- 행(끼니 × 반) 계산 — 학년-반 순
    var rows = [];
    types.forEach(function (t) {
      var r = d.todayByType[t];
      if (!r.count) return;
      var byClass = {};
      r.affected.forEach(function (a) {
        var st = a.student;
        var key = t + '|' + st.grade + '|' + st.classNo;
        if (!byClass[key]) byClass[key] = { key: key, grade: st.grade, classNo: st.classNo, type: t, teacher: '', names: [] };
        var g = byClass[key];
        if (!g.teacher && st.teacher && st.teacher.name) g.teacher = st.teacher.name;
        g.names.push(st.name);
      });
      Object.keys(byClass).map(function (k) { return byClass[k]; })
        .sort(function (a, b) { return (a.grade - b.grade) || (a.classNo - b.classNo); })
        .forEach(function (g) {
          g.inner = '<div class="br-cls"><div class="cls">' + g.grade + '-' + g.classNo + '</div>' +
            '<div class="tch">' + (types.length > 1 ? h(t) + ' · ' : '') + (g.teacher ? '담임 ' + h(g.teacher) : g.names.length + '명') + '</div></div>' +
            '<div class="br-cards">' + g.names.map(function (n) { return '<div class="bc">' + h(n) + '</div>'; }).join('') + '</div>';
          g.sig = g.inner;
          rows.push(g);
        });
    });

    // ---- 바뀐 행만 교체
    var flow = self.cur;
    var existing = {};
    Array.prototype.forEach.call(flow.children, function (k) { existing[k.dataset.key] = k; });
    var changed = false;
    rows.forEach(function (g, i) {
      var elG = existing[g.key];
      if (!elG) { elG = document.createElement('section'); elG.className = 'br'; elG.dataset.key = g.key; changed = true; }
      else delete existing[g.key];
      if (elG.dataset.sig !== g.sig) { elG.innerHTML = g.inner; elG.dataset.sig = g.sig; changed = true; }
      if (flow.children[i] !== elG) { flow.insertBefore(elG, flow.children[i] || null); changed = true; }
    });
    Object.keys(existing).forEach(function (k) { existing[k].remove(); changed = true; });
    var longest = 2;
    rows.forEach(function (g) { g.names.forEach(function (n) { if (n.length > longest) longest = n.length; }); });
    self.longestName = Math.min(longest, 6);
    self.studentCount = total;
    if (changed || !self.fitted) self.fit();
    else self.status();
  },

  /**
   * 화면 높이에 들어가는 가장 큰 배율 선택.
   * 반이 MAX_ROWS 개를 넘으면 한 화면에 다 넣으려 줄이지 않고, MAX_ROWS 개씩 페이지로 나눈 뒤
   * 각 페이지가 들어가는 가장 큰 배율을 고른다. 최소 배율에서도 넘치면 행 단위 페이지.
   */
  fit: function () {
    var self = this;
    var board = App.$('#board'), view = App.$('#board-view'), flow = self.cur;
    if (!board || !view || !flow || self.lastMode !== 'list') return;
    var availH = view.clientHeight;
    var manyRows = flow.children.length > self.MAX_ROWS;
    var best = null;
    for (var i = 0; i < self.SCALES.length; i++) {
      self.applyScale(board, self.SCALES[i]);
      if (manyRows ? self.chunksFit(flow, availH) : flow.scrollHeight <= availH) { best = self.SCALES[i]; break; }
    }
    if (self._flipTimer) { clearInterval(self._flipTimer); self._flipTimer = null; }
    if (best !== null && !manyRows) {
      self.pages = [0]; self.page = 0;
      flow.style.transform = ''; flow.style.clipPath = '';
      self.alt.innerHTML = '';
      self.status();
    } else {
      if (best === null) self.applyScale(board, self.SCALES[self.SCALES.length - 1]);
      self.paginate();
    }
    self.fitted = true;
  },

  /** MAX_ROWS 개씩 끊은 각 묶음이 화면 높이에 들어가는지 */
  chunksFit: function (flow, availH) {
    var kids = flow.children;
    for (var i = 0; i < kids.length; i += this.MAX_ROWS) {
      var last = kids[Math.min(i + this.MAX_ROWS, kids.length) - 1];
      if (last.offsetTop + last.offsetHeight - kids[i].offsetTop > availH) return false;
    }
    return true;
  },

  /** 배율 → 글자·카드 크기. 카드 폭은 가장 긴 이름 기준으로 전부 동일 */
  applyScale: function (board, s) {
    var nm = Math.max(20, Math.round(56 * s));
    board.style.setProperty('--nm', nm + 'px');
    board.style.setProperty('--cw', Math.round(nm * ((this.longestName || 3) + 0.6) + 36) + 'px');
    board.style.setProperty('--ch', Math.round(nm * 1.6) + 'px');
    board.style.setProperty('--cls', Math.round(nm * 1.15) + 'px');
    board.style.setProperty('--tch', Math.max(13, Math.round(nm * 0.42)) + 'px');
    board.style.setProperty('--rp', Math.max(6, Math.round(nm * 0.22)) + 'px');
  },

  /** 행 단위 페이지 경계 — 높이 초과 또는 한 페이지 MAX_ROWS 개에서 끊는다 */
  paginate: function () {
    var self = this;
    var view = App.$('#board-view'), flow = self.cur;
    if (self._flipTimer) { clearInterval(self._flipTimer); self._flipTimer = null; }
    if (!view || !flow) return;
    var avail = view.clientHeight;
    var pages = [0], start = 0, count = 0;
    Array.prototype.forEach.call(flow.children, function (k) {
      var top = k.offsetTop, bottom = top + k.offsetHeight;
      if ((bottom - start > avail || count >= self.MAX_ROWS) && top > start) { start = top; pages.push(top); count = 0; }
      count++;
    });
    self.pages = pages;
    self.flowHeight = flow.scrollHeight;
    if (self.page >= pages.length) self.page = 0;
    self.applyPage(flow, self.page);
    self.alt.innerHTML = '';
    self.status();
    if (pages.length > 1) self._flipTimer = setInterval(function () { self.flip(1); }, self.FLIP_MS);
  },

  applyPage: function (flow, idx) {
    var top = this.pages[idx], next = this.pages[idx + 1];
    flow.style.transform = 'translateY(-' + top + 'px)';
    flow.style.clipPath = next ? 'inset(' + top + 'px 0 ' + Math.max(0, (this.flowHeight || 0) - next) + 'px 0)' : 'inset(' + top + 'px 0 0 0)';
  },

  /** 1초 크로스페이드로 페이지 전환: 숨은 레이어에 다음 페이지를 그려 놓고 서로 opacity 교차 */
  flip: function (n) {
    var self = this;
    if (!self.pages || self.pages.length < 2 || self.flipping) return;
    self.flipping = true;
    self.page = (self.page + n + self.pages.length) % self.pages.length;
    var from = self.cur, to = self.alt;
    to.innerHTML = from.innerHTML;
    self.applyPage(to, self.page);
    to.classList.add('show');
    from.classList.remove('show');
    self.cur = to; self.alt = from;
    self.status();
    setTimeout(function () { self.alt.innerHTML = ''; self.flipping = false; }, self.FADE_MS + 50);
  },
};
</script>
