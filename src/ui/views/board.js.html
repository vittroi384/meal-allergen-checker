<script>
/**
 * 전광판 모드 (#/board): 오늘 해당 학생 이름만 큰 글씨로 전체 화면.
 * - 카드는 이름만, 단일 스타일, 같은 크기. 열 수는 학생 수로 고정: ≤10명 2열, 11~20명 3열, 21명~ 4열
 * - 반별 그룹(헤더 한 줄 작게: "1학년 1반 · 담임 OOO · n명")
 * - 세로로 한 화면에 들어가는 가장 큰 글자 배율을 측정으로 선택. 최소 배율에서도 안 들어가면(30명 초과 등) 그룹 단위 페이지 전환 — 10초 간격, 1초 크로스페이드
 * - 5분마다 다시 받아 바뀐 그룹만 교체 (전체 리렌더 없음). Esc 또는 구석의 작은 버튼으로 나가기
 * - 대시보드 API(apiDashboard) 데이터를 그대로 사용
 */
App.views.board = {
  title: '전광판',
  skeleton: 'dashboard',
  FLIP_MS: 10000,
  FADE_MS: 1000,
  REFRESH_MS: 5 * 60 * 1000,
  // 글자 배율 후보 (큰 것부터). 이름 58px 기준
  SCALES: [1.7, 1.55, 1.4, 1.25, 1.12, 1.0, 0.9, 0.82, 0.74, 0.66, 0.6, 0.55, 0.5, 0.45],
  CARD_GAP: 10,

  colsFor: function (total) { return total <= 10 ? 2 : total <= 20 ? 3 : 4; },

  render: function (el) {
    var self = this;
    var h = App.h;
    self.leave();
    document.body.classList.add('board-mode');
    self.page = 0; self.pages = [0]; self.lastHead = ''; self.lastMode = ''; self.data = null; self.flipping = false; self.fitted = false;
    self._timers = [];
    el.innerHTML =
      '<div class="board" id="board">' +
        '<div class="board-head" id="board-head"><span class="loading">불러오는 중…</span></div>' +
        '<div class="board-view" id="board-view">' +
          '<div class="board-flow show" id="board-flow-a"></div><div class="board-flow" id="board-flow-b"></div>' +
          '<div class="board-msg" id="board-msg" hidden></div>' +
        '</div>' +
      '</div>' +
      '<div class="board-foot"><span id="board-status"></span><button class="board-exit" id="board-exit" title="Esc">✕</button></div>';
    self.cur = App.$('#board-flow-a');
    self.alt = App.$('#board-flow-b');
    App.$('#board-exit').onclick = function () { App.go('dashboard'); };

    self._keyHandler = function (e) {
      if (e.key === 'Escape') { App.go('dashboard'); return; }
      if (e.key === 'ArrowRight' || e.key === ' ') self.flip(1);
      if (e.key === 'ArrowLeft') self.flip(-1);
    };
    document.addEventListener('keydown', self._keyHandler);
    var resizeT = null;
    self._onResize = function () { clearTimeout(resizeT); resizeT = setTimeout(function () { self.fit(); }, 200); };
    window.addEventListener('resize', self._onResize);

    var load = function (force) {
      var p = force
        ? App.api('apiDashboard').then(function (d) { App.cachePut('dashboard', d); return d; })
        : App.cached('dashboard', function () { return App.api('apiDashboard'); });
      return p.then(function (d) { self.data = d; self.loadedAt = new Date(); self.draw(); })
        .catch(function (e) {
          if (!self.data) App.$('#board-head').innerHTML = '<span class="loading">불러오지 못했습니다 — ' + h(e.message) + '</span>';
          self.status();
        });
    };
    self._timers.push(setInterval(function () { load(true); }, self.REFRESH_MS));
    self._timers.push(setInterval(function () { self.tickClock(); }, 15 * 1000));
    return load(false).then(function () {
      // 첫 그리기 직후에는 글꼴·레이아웃이 확정되기 전에 측정될 수 있어 잠시 후 한 번 더 맞춘다
      setTimeout(function () { self.fit(); }, 600);
      try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { self.fit(); }); } catch (e) { /* 무시 */ }
    });
  },

  /** 라우터가 다른 화면으로 넘어갈 때 — 타이머·리스너·body 클래스 정리 */
  leave: function () {
    var self = this;
    document.body.classList.remove('board-mode');
    (self._timers || []).forEach(clearInterval);
    self._timers = [];
    if (self._flipTimer) { clearInterval(self._flipTimer); self._flipTimer = null; }
    if (self._keyHandler) { document.removeEventListener('keydown', self._keyHandler); self._keyHandler = null; }
    if (self._onResize) { window.removeEventListener('resize', self._onResize); self._onResize = null; }
  },

  tickClock: function () {
    var c = App.$('#board-clock');
    if (c) { var d = new Date(); c.textContent = App.pad(d.getHours()) + ':' + App.pad(d.getMinutes()); }
  },

  status: function () {
    var s = App.$('#board-status');
    if (!s) return;
    var parts = [];
    if (this.loadedAt) parts.push('갱신 ' + App.pad(this.loadedAt.getHours()) + ':' + App.pad(this.loadedAt.getMinutes()));
    if (this.pages && this.pages.length > 1) parts.push((this.page + 1) + '/' + this.pages.length);
    parts.push('Esc 나가기');
    s.textContent = parts.join(' · ');
  },

  /** 데이터 → 화면. 바뀐 부분만 DOM 에 반영한다 */
  draw: function () {
    var self = this;
    var h = App.h;
    var d = self.data;
    if (!d || !App.$('#board')) return;

    var types = d.mealTypes.filter(function (t) { return d.todayByType[t].menus.length > 0; });
    var total = 0;
    types.forEach(function (t) { total += d.todayByType[t].count; });

    // ---- 상단 한 줄 (예외 화면에서도 유지)
    var headHtml = '<span class="date">' + h(d.todayLabel) + '</span>' +
      (types.length
        ? types.map(function (t) { var r = d.todayByType[t]; return '<span class="sep">·</span><span class="meal">' + h(t) + '</span><span class="cnt ' + (r.count ? 'hit' : 'ok') + '">해당 ' + r.count + '명</span>'; }).join('')
        : '<span class="sep">·</span><span class="meal muted">급식 없음</span>') +
      '<span class="clock" id="board-clock"></span>';
    if (headHtml !== self.lastHead) { App.$('#board-head').innerHTML = headHtml; self.lastHead = headHtml; }
    self.tickClock();

    // ---- 예외 화면: 화면 중앙에 크게 + 날짜
    var msg = App.$('#board-msg');
    var mode = !types.length ? 'nomeal' : (!total ? 'none' : 'list');
    if (mode !== 'list') {
      var msgHtml = (mode === 'nomeal'
        ? '<div class="big muted">급식 없음</div>'
        : '<div class="big ok">오늘 해당 학생 없음</div>') +
        '<div class="date">' + h(d.todayLabel) + (types.length ? ' · ' + h(types.join(' · ')) : '') + '</div>';
      if (msg.innerHTML !== msgHtml) msg.innerHTML = msgHtml;
      msg.hidden = false;
      self.cur.classList.remove('show'); self.alt.classList.remove('show');
      self.pages = [0]; self.page = 0;
      if (self._flipTimer) { clearInterval(self._flipTimer); self._flipTimer = null; }
      self.lastMode = mode;
      self.status();
      return;
    }
    msg.hidden = true;
    if (self.lastMode !== 'list') self.cur.classList.add('show');
    self.lastMode = mode;

    // ---- 그룹(끼니 × 반) 계산
    var groups = [];
    types.forEach(function (t) {
      var r = d.todayByType[t];
      if (!r.count) return;
      var byClass = {};
      var order = [];
      r.affected.forEach(function (a) {
        var st = a.student;
        var key = t + '|' + st.grade + '|' + st.classNo;
        if (!byClass[key]) { byClass[key] = { key: key, grade: st.grade, classNo: st.classNo, type: t, teacher: '', names: [] }; order.push(key); }
        var g = byClass[key];
        if (!g.teacher && st.teacher && st.teacher.name) g.teacher = st.teacher.name;
        g.names.push(st.label);
      });
      order.forEach(function (k) {
        var g = byClass[k];
        var head = (types.length > 1 ? h(t) + ' · ' : '') + g.grade + '학년 ' + g.classNo + '반' + (g.teacher ? ' · 담임 ' + h(g.teacher) : '') + ' · ' + g.names.length + '명';
        g.inner = '<div class="bg-head">' + head + '</div><div class="bg-grid">' + g.names.map(function (n) { return '<div class="bc">' + h(n) + '</div>'; }).join('') + '</div>';
        g.sig = g.inner;
        groups.push(g);
      });
    });

    // ---- 바뀐 그룹만 교체
    var flow = self.cur;
    var existing = {};
    Array.prototype.forEach.call(flow.children, function (k) { existing[k.dataset.key] = k; });
    var changed = false;
    groups.forEach(function (g, i) {
      var elG = existing[g.key];
      if (!elG) { elG = document.createElement('section'); elG.className = 'bg'; elG.dataset.key = g.key; changed = true; }
      else delete existing[g.key];
      if (elG.dataset.sig !== g.sig) { elG.innerHTML = g.inner; elG.dataset.sig = g.sig; elG.dataset.n = String(g.names.length); changed = true; }
      if (flow.children[i] !== elG) { flow.insertBefore(elG, flow.children[i] || null); changed = true; }
    });
    Object.keys(existing).forEach(function (k) { existing[k].remove(); changed = true; });
    if (total !== self.studentCount) changed = true;
    self.studentCount = total;
    if (changed || !self.fitted) self.fit();
    else self.status();
  },

  /** 열 수는 학생 수로 고정, 세로로 한 화면에 들어가는 가장 큰 배율 선택 → 안 들어가면 그룹 단위 페이지 */
  fit: function () {
    var self = this;
    var board = App.$('#board'), view = App.$('#board-view'), flow = self.cur;
    if (!board || !view || !flow || self.lastMode !== 'list') return;
    var availH = view.clientHeight, availW = view.clientWidth;
    var cols = self.colsFor(self.studentCount || 0);
    board.style.setProperty('--cols', String(cols));
    // 반 그룹은 학생 수만큼만 열을 차지(최대 열 수). 남는 열에는 다음 반이 이어져 들어간다 (grid-auto-flow: dense)
    Array.prototype.forEach.call(flow.children, function (g) {
      g.style.setProperty('--span', String(Math.min(cols, Math.max(1, Number(g.dataset.n) || 1))));
    });
    var best = null;
    for (var i = 0; i < self.SCALES.length; i++) {
      self.applyScale(board, self.SCALES[i], cols, availW);
      if (flow.scrollHeight <= availH) { best = self.SCALES[i]; break; }
    }
    if (self._flipTimer) { clearInterval(self._flipTimer); self._flipTimer = null; }
    if (best !== null) {
      self.pages = [0]; self.page = 0;
      flow.style.transform = ''; flow.style.clipPath = '';
      self.alt.innerHTML = '';
      self.status();
    } else {
      self.applyScale(board, self.SCALES[self.SCALES.length - 1], cols, availW);
      self.paginate();
    }
    self.fitted = true;
  },

  /** 배율 → 글자·카드 크기. 이름이 열 폭 안에 들어가도록 상한("1-1 남궁민수" ≈ 6.1em → 7.2em 기준) */
  applyScale: function (board, s, cols, availW) {
    var colW = (availW - this.CARD_GAP * (cols - 1)) / cols;
    var nm = Math.min(Math.round(58 * s), Math.floor((colW - 44) / 7.2));
    nm = Math.max(nm, 20);
    board.style.setProperty('--nm', nm + 'px');
    board.style.setProperty('--ch', Math.round(nm * 1.65) + 'px');
    board.style.setProperty('--gh', Math.max(14, Math.round(nm * 0.4)) + 'px');
  },

  /** 그룹 단위 페이지 경계 (그룹은 블록 배치라 offsetTop 이 순서대로 증가) */
  paginate: function () {
    var self = this;
    var view = App.$('#board-view'), flow = self.cur;
    if (self._flipTimer) { clearInterval(self._flipTimer); self._flipTimer = null; }
    if (!view || !flow) return;
    var avail = view.clientHeight;
    var pages = [0], start = 0;
    // dense 배치라 DOM 순서와 화면 순서가 다를 수 있어 세로 위치로 정렬해 행 단위 경계를 찾는다
    var kids = Array.prototype.slice.call(flow.children).sort(function (a, b) { return a.offsetTop - b.offsetTop; });
    kids.forEach(function (k) {
      var top = k.offsetTop, bottom = top + k.offsetHeight;
      if (bottom - start > avail && top > start) { start = top; pages.push(top); }
    });
    self.pages = pages;
    self.flowHeight = flow.scrollHeight;
    if (self.page >= pages.length) self.page = 0;
    self.applyPage(flow, self.page);
    self.alt.innerHTML = '';
    self.status();
    if (pages.length > 1) self._flipTimer = setInterval(function () { self.flip(1); }, self.FLIP_MS);
  },

  applyPage: function (flow, idx) {
    var top = this.pages[idx], next = this.pages[idx + 1];
    flow.style.transform = 'translateY(-' + top + 'px)';
    flow.style.clipPath = next ? 'inset(' + top + 'px 0 ' + Math.max(0, (this.flowHeight || 0) - next) + 'px 0)' : 'inset(' + top + 'px 0 0 0)';
  },

  /** 1초 크로스페이드로 페이지 전환: 숨은 레이어에 다음 페이지를 그려 놓고 서로 opacity 교차 */
  flip: function (n) {
    var self = this;
    if (!self.pages || self.pages.length < 2 || self.flipping) return;
    self.flipping = true;
    self.page = (self.page + n + self.pages.length) % self.pages.length;
    var from = self.cur, to = self.alt;
    to.innerHTML = from.innerHTML;
    self.applyPage(to, self.page);
    to.classList.add('show');
    from.classList.remove('show');
    self.cur = to; self.alt = from;
    self.status();
    setTimeout(function () { self.alt.innerHTML = ''; self.flipping = false; }, self.FADE_MS + 50);
  },
};
</script>
