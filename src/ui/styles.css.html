<style>
  /* 앱 전체 스타일 시트 (모든 화면 공용, index.html 에 include).
     구성: 변수 → 기본 요소 → 레이아웃 → 컴포넌트(카드·버튼·표·폼·달력·메뉴 목록·모달) → 인쇄 → 전광판 */
  /* 색·크기 변수: *-soft 는 같은 계열의 연한 배경색 (배지·알림 배경용) */
  :root {
    --bg: #f5f7fb; --card: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
    --primary: #2563eb; --primary-dark: #1d4ed8; --primary-soft: #dbeafe;
    --danger: #dc2626; --danger-soft: #fee2e2; --warn: #b45309; --warn-soft: #fef3c7;
    --ok: #059669; --ok-soft: #d1fae5; --purple: #7c3aed; --purple-soft: #ede9fe;
    --radius: 12px; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  /* 기본 요소 리셋·타이포그래피 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: var(--primary); text-decoration: none; }
  button { font-family: inherit; }
  h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; }
  h2 { font-size: 20px; }
  h3 { font-size: 15px; }
  p { margin: 0; }
  code { font-family: Consolas, 'D2Coding', monospace; font-size: 12px; background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }

  /* 레이아웃 */
  /* 상단 고정 바 + 가운데 정렬 본문(max 1400px) + 반응형 그리드 */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--border); }
  .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 16px; height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; white-space: nowrap; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: grid; place-items: center; color: #fff; font-size: 15px; }
  .brand .school { font-weight: 500; color: var(--muted); font-size: 13px; }
  .nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; font-size: 13.5px; }
  .nav a.active { background: var(--primary-soft); color: var(--primary-dark); }
  .nav a:hover { color: var(--primary-dark); }
  .topbar .spacer { flex: 1; }
  .main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; gap: 16px; }
  .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 900px) { .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; } .topbar-inner { gap: 8px; } .brand .school { display: none; } .main { padding: 14px 12px 60px; } }

  /* 카드 */
  /* 기본 콘텐츠 상자. .stat 은 대시보드 상단 숫자 카드, .notice 는 카드 안 알림 띠 */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .card + .card { margin-top: 16px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-head h3 { display: flex; align-items: center; gap: 8px; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat.clickable { cursor: pointer; transition: box-shadow .12s, border-color .12s; }
  .stat.clickable:hover { border-color: #fbbf24; box-shadow: 0 0 0 2px #fef3c7; }
  .stat:not(.clickable) .hint b { font-weight: 500; color: var(--muted); }
  .stat .label { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .stat .value { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .stat .value.danger { color: var(--danger); }
  .stat .value.warn { color: var(--warn); }
  .stat .value.ok { color: var(--ok); }
  .stat .hint { color: var(--muted); font-size: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 10px; font-size: 13.5px; }
  .notice { padding: 10px 14px; border-radius: 10px; font-size: 13.5px; border: 1px solid transparent; }
  .notice.warn { background: var(--warn-soft); color: #78350f; border-color: #fde68a; }
  .notice.danger { background: var(--danger-soft); color: #7f1d1d; border-color: #fecaca; }
  .notice.info { background: var(--primary-soft); color: #1e3a8a; border-color: #bfdbfe; }
  .notice.ok { background: var(--ok-soft); color: #064e3b; border-color: #a7f3d0; }

  /* 버튼 */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 600; font-size: 13.5px; cursor: pointer; transition: background .12s, border-color .12s; white-space: nowrap; }
  .btn:hover { background: #f9fafb; border-color: #d1d5db; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--danger); border-color: #fecaca; background: #fff; }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--primary); }
  .btn.ghost:hover { background: var(--primary-soft); }
  .btn.icon { padding: 6px 8px; }

  /* 배지/태그 */
  /* .badge 는 상태 표시(확인 필요·수동 등), .tag 는 알레르기 칩 (.hit = 학생과 겹치는 코드 강조) */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 1.5; white-space: nowrap; }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.purple { background: var(--purple-soft); color: var(--purple); }
  .badge.gray { background: #f3f4f6; color: var(--muted); }
  .badge.blue { background: var(--primary-soft); color: var(--primary-dark); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: #eef2ff; color: #3730a3; margin: 1px 2px 1px 0; white-space: nowrap; word-break: keep-all; }
  .tag.hit { background: var(--danger-soft); color: var(--danger); }
  .tag.kw { background: var(--warn-soft); color: var(--warn); }

  /* 표 */
  /* 표: 셀은 기본적으로 줄바꿈 금지(단어 중간 쪼개짐 방지). 긴 텍스트 열만 .wrap, 칩 열은 .chips(칩 사이에서만 줄바꿈).
     열이 안 들어가면 찌그러뜨리지 않고 .table-wrap 안에서 가로 스크롤 */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 10px; max-width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; word-break: keep-all; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; white-space: nowrap; word-break: keep-all; }
  td.wrap, th.wrap { white-space: normal; overflow-wrap: anywhere; min-width: 180px; max-width: 420px; }
  td.chips { white-space: normal; min-width: 120px; max-width: 320px; }
  td.chips .tag { display: inline-block; white-space: nowrap; }
  td.name { min-width: 5.5em; font-weight: 700; }
  td .sub-contact { color: var(--muted); font-size: 12.5px; margin-left: 4px; }
  /* 화면 폭에 맞추는 고정 배분 표 (가로 스크롤 없음) + 세로 스크롤·헤더 고정 */
  .table-wrap.fit { overflow-x: auto; }
  .table-wrap.fit table { table-layout: fixed; width: 100%; }
  .table-wrap.fit td { overflow: hidden; text-overflow: ellipsis; }
  /* 내용 크기로 고정하는 열(배지·버튼): 절대 잘리거나 말줄임되지 않음 */
  .table-wrap td.keep, .table-wrap th.keep { overflow: visible !important; text-overflow: clip !important; white-space: nowrap; }
  .table-wrap td.keep .btn + .btn { margin-left: 4px; }
  .table-wrap td.keep:last-child, .table-wrap th.keep:last-child { padding-right: 16px; }
  td.note { font-size: 12.5px; color: #374151; }
  /* 행 높이 통일(한 줄), 세로 가운데. 칩·배지·텍스트가 같은 높이에 놓이도록 */
  .table-wrap.uniform th, .table-wrap.uniform td { height: 44px; padding-top: 0; padding-bottom: 0; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .table-wrap.uniform td.chips { white-space: nowrap; }
  .table-wrap.uniform td.chips .tag { vertical-align: middle; margin: 0 3px 0 0; }
  .table-wrap.uniform .badge { vertical-align: middle; }
  .table-wrap.uniform td.wrap { white-space: normal; line-height: 1.35; height: auto; padding-top: 8px; padding-bottom: 8px; }
  .table-wrap.uniform td .btn.sm { vertical-align: middle; }
  .badge.fixed { width: 54px; justify-content: center; padding-left: 0; padding-right: 0; }
  .badge.fixed.gray-text { background: transparent; color: var(--muted); font-weight: 600; }
  .table-wrap.tall { overflow-y: auto; max-height: calc(100vh - 290px); min-height: 240px; }
  .table-wrap.tall thead th { position: sticky; top: 0; z-index: 2; box-shadow: 0 1px 0 var(--border); }
  td.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
  td.two-line { line-height: 1.3; }
  td.two-line .l2 { display: block; color: var(--muted); font-size: 12px; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--primary-dark); }
  th.sortable .arrow { display: inline-block; width: 12px; color: var(--primary); font-size: 10px; margin-left: 2px; }
  .hover-info { cursor: help; border-bottom: 1px dotted #9ca3af; }
  /* 칩 입력 */
  .chip-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; min-height: 40px; }
  .chip-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
  .chip-input .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 2px 6px 2px 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .chip-input .chip.listed { background: #eef2ff; color: #3730a3; }
  .chip-input .chip button { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 13px; padding: 0 2px; line-height: 1; }
  .chip-input input { flex: 1; min-width: 120px; border: 0 !important; box-shadow: none !important; padding: 4px 2px; }
  .chip-suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip-suggest button { font-size: 12px; }
  .chip-add { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  th { background: #f9fafb; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; position: sticky; top: 0; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #fafbff; }
  td.num, th.num { text-align: right; }
  td.center, th.center { text-align: center; }
  .nowrap { white-space: nowrap; }
  tr.row-error td { background: #fff7f7; }
  tr.row-add td { background: #f0fdf4; }
  tr.row-update td { background: #eff6ff; }

  /* 폼 */
  /* 2열 그리드(.form-grid) + 라벨/입력 세로 묶음(.field). 640px 이하 1열 */
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12.5px; font-weight: 700; color: #374151; }
  .field .help { font-size: 12px; color: var(--muted); }
  input[type=text], input[type=password], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=month], input[type=time], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; font-size: 13.5px; background: #fff; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
  textarea { min-height: 120px; resize: vertical; font-family: inherit; }
  .inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .inline > * { flex: 0 0 auto; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; cursor: pointer; user-select: none; }
  .check input { width: 16px; height: 16px; accent-color: var(--primary); }
  /* 토글 스위치 (체크박스를 시각적으로 덮어 그림) */
  .switch { position: relative; width: 40px; height: 22px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #d1d5db; border-radius: 999px; transition: .15s; }
  .switch span::after { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--primary); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .codes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 10px; }
  .codes-grid .check { font-size: 13px; }
  .error-text { color: var(--danger); font-size: 12.5px; }
  .ok-text { color: var(--ok); font-size: 12.5px; }
  .secret-row { display: flex; gap: 8px; align-items: center; }
  .secret-row input { flex: 1; }
  /* 탭 줄 (설정 화면 등): button 형·a 형 둘 다 지원 */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .tabs button { background: none; border: 0; padding: 8px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; font-size: 13.5px; }
  .tabs button.active { color: var(--primary-dark); border-bottom-color: var(--primary); }
  .tabs a { display: inline-block; padding: 8px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13.5px; margin-bottom: -1px; }
  .tabs a.active { color: var(--primary-dark); border-bottom-color: var(--primary); }
  td input[type=text], td input[type=tel], td input[type=email], td input[type=number] { padding: 6px 8px; font-size: 13px; min-width: 90px; }
  /* 파일 업로드 드롭존 (학생 명단 가져오기 등). 내부 input 은 숨기고 클릭·드래그로만 받음 */
  .dropzone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 24px; text-align: center; color: var(--muted); background: #f8fafc; cursor: pointer; }
  .dropzone.over { border-color: var(--primary); background: var(--primary-soft); }
  .dropzone input { display: none; }

  /* 달력: 모든 셀 높이 동일, 배지 줄은 비어 있어도 자리 유지 → 숫자 위치 고정 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-dow { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; padding: 4px 0; }
  .cal-dow.sun { color: var(--danger); } .cal-dow.sat { color: var(--primary); }
  .cal-cell { height: 96px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 8px 6px; cursor: pointer; display: grid; grid-template-rows: 18px 1fr 20px; align-items: center; transition: border-color .12s, box-shadow .12s; position: relative; overflow: hidden; }
  .cal-cell:hover { border-color: #93c5fd; box-shadow: var(--shadow); }
  .cal-cell.other { visibility: hidden; pointer-events: none; }
  .cal-cell.dim { opacity: .5; background: #fafafa; }
  .cal-cell.today { border: 2px solid var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); padding: 7px 7px 5px; }
  .cal-cell .d { font-weight: 700; font-size: 13px; line-height: 18px; }
  .cal-cell.sun .d { color: var(--danger); } .cal-cell.sat .d { color: var(--primary); }
  .cal-cell .cnt { font-size: 24px; font-weight: 800; color: var(--danger); line-height: 1; text-align: center; }
  .cal-cell .cnt.zero { color: #9ca3af; }
  .cal-cell .cnt.none { color: #d1d5db; font-size: 12px; font-weight: 600; }
  .cal-cell .badges { height: 20px; display: flex; gap: 3px; align-items: center; overflow: hidden; }
  .badge.tiny { font-size: 10px; padding: 0 6px; line-height: 16px; }
  @media (max-width: 640px) { .cal-cell { height: 72px; padding: 5px; grid-template-rows: 16px 1fr 16px; } .cal-cell .cnt { font-size: 18px; } .cal-grid { gap: 3px; } .badge.tiny { font-size: 9px; padding: 0 4px; line-height: 14px; } }
  /* 학생별 월간 현황: 셀 안에 원인 메뉴(최대 2줄) / 급식일인데 해당 없음은 ✓ */
  .cal-cell .menus { font-size: 11.5px; line-height: 1.3; color: #7f1d1d; font-weight: 600; overflow: hidden; align-self: start; word-break: keep-all; }
  .cal-cell .menus .more { color: var(--muted); font-weight: 500; }
  .cal-cell.hit { background: #fff5f5; border-color: #fecaca; }
  .cal-cell .cnt.ok { color: #16a34a; font-size: 20px; }
  @media (max-width: 640px) { .cal-cell .menus { font-size: 10px; } }
  /* 학생 관리 알레르기별 인원 칩 (표시 중인 학생 기준). 클릭 = 그 알레르기로 검색 */
  .stat-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; font-size: 12.5px; }
  .stat-chips .lbl { color: var(--muted); font-weight: 700; margin-right: 2px; }
  .stat-chips .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
  .stat-chip { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--text); line-height: 1.4; }
  .stat-chip b { margin-left: 5px; color: var(--danger); }
  .stat-chip:hover { border-color: #93c5fd; }
  .stat-chip.on { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
  .stat-chip.kw { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .stat-chip.kw.on { border-color: var(--warn); }
  tbody tr.clickable { cursor: pointer; } tbody tr.clickable:hover td { background: #f8fafc; }
  td.name a.stu-link { color: inherit; text-decoration: none; border-bottom: 1px dashed #93c5fd; }
  td.name a.stu-link:hover { color: var(--primary); border-bottom-style: solid; }
  /* 이번 주 스트립 (대시보드): 7일 한 줄, 클릭하면 아래 패널이 그 날짜로 바뀜 */
  .week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .week-day { border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer; background: var(--card); }
  .week-day.today { border-color: var(--primary); background: #eff6ff; }
  .week-day.today .dl::after { content: ' · 오늘'; color: var(--primary); }
  .week-day.selected { box-shadow: 0 0 0 2px var(--primary); border-color: var(--primary); background: #dbeafe; }
  .week-day:hover { border-color: var(--primary); }
  #day-panels.loading { opacity: .6; transition: opacity .15s; }
  .week-day .dl { font-size: 12px; color: var(--muted); font-weight: 700; }
  .week-day .n { font-size: 22px; font-weight: 800; color: var(--danger); }
  .week-day .n.zero { color: #9ca3af; }
  .week-day .n.none { color: #d1d5db; font-size: 14px; }
  .week-day .wb { height: 18px; display: flex; justify-content: center; gap: 3px; align-items: center; }
  .week-day.dim { opacity: .55; }
  @media (max-width: 640px) { .week-strip { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; } .week-day { padding: 6px 2px; } .week-day .n { font-size: 16px; } }

  /* 메뉴 목록 */
  /* 날짜 상세·대시보드 패널 공용. .needs = 확인 필요 메뉴 노란 강조 */
  .menu-list { display: flex; flex-direction: column; gap: 6px; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .menu-item .name { font-weight: 600; flex: 1; min-width: 0; }
  .menu-item .tags { display: flex; flex-wrap: wrap; gap: 2px; }
  .menu-item .ops { display: flex; gap: 4px; }
  .menu-item.needs { border-color: #fde68a; background: #fffbeb; }
  /* 해당 학생 목록: 급식을 못 먹는 학생 카드(빨간 계열) */
  .affected-list { display: flex; flex-direction: column; gap: 8px; }
  .affected-item { padding: 10px 12px; border-radius: 10px; background: #fff5f5; border: 1px solid #fecaca; }
  .affected-item .who { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .affected-item .who .t { font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .affected-item .who .note { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 8px; }
  .affected-item .why { color: #7f1d1d; font-size: 13px; margin-top: 2px; }
  .affected-item .tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 2px; }
  .affected-item.clickable { cursor: pointer; transition: box-shadow .12s, border-color .12s; }
  .affected-item.clickable:hover { border-color: #f87171; box-shadow: 0 0 0 2px #fee2e2; }
  /* 반별 그룹 (해당 학생 공용 컴포넌트) */
  .list-head .right { display: flex; align-items: center; gap: 8px; }
  .aff-group { border: 1px solid var(--border); border-radius: 10px; background: #fff; overflow: hidden; }
  .aff-group + .aff-group { margin-top: 6px; }
  .aff-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; user-select: none; background: #f9fafb; min-width: 0; }
  .aff-head:hover { background: #f3f4f6; }
  .aff-head .chev { flex: 0 0 auto; width: 12px; color: var(--muted); font-size: 9px; transition: transform .15s; }
  .aff-group.open .aff-head .chev { transform: rotate(90deg); }
  .aff-head b { font-weight: 800; flex: 0 0 auto; }
  .aff-head .t { color: var(--muted); font-size: 12.5px; flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aff-head .n { flex: 0 0 auto; font-size: 11.5px; font-weight: 700; color: var(--danger); background: var(--danger-soft); border-radius: 999px; padding: 1px 8px; }
  .aff-head .sum { flex: 1 1 auto; min-width: 40px; margin-left: auto; text-align: right; color: #374151; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aff-group.open .aff-head .sum { display: none; }
  .aff-body { display: none; flex-direction: column; gap: 6px; padding: 6px; border-top: 1px solid var(--border); }
  .aff-group.open .aff-body { display: flex; }
  .tag.more { background: #e5e7eb; color: #374151; }
  /* 날짜 상세 메뉴 행(.menu-item.row): 행 전체 클릭 = 수정, 오른쪽 끝 "···" 고정, 배지 열 폭 고정 → 버튼 유무와 무관하게 행 모양 동일 */
  /* 열: 이름(가변) | 칩+배지 고정 폭 300px(오른쪽 정렬 → 모든 행의 칩·배지 세로선 일치) | ··· 28px */
  .menu-item.row { display: grid; grid-template-columns: minmax(0, 1fr) 300px 28px; align-items: center; gap: 10px; min-height: 44px; padding: 6px 6px 6px 12px; cursor: pointer; transition: background .12s, border-color .12s; }
  .menu-item.row:hover { background: #f8fafc; border-color: #cbd5e1; }
  .menu-item.row.needs:hover { background: #fef3c7; }
  .menu-item.row.pending { opacity: .5; pointer-events: none; }
  .menu-item.row .meta { display: flex; justify-content: flex-end; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .menu-item.row .meta .tags { display: flex; justify-content: flex-end; gap: 2px; flex-wrap: wrap; }
  .menu-item.row .meta .badge { flex: 0 0 auto; }
  @media (max-width: 760px) { .menu-item.row { grid-template-columns: minmax(0, 1fr) auto 28px; } }
  .menu-item.row.confirm-del { grid-template-columns: 1fr; background: #fff1f2; border-color: #fecaca; cursor: default; }
  .menu-item.row .del-inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
  .menu-item.row .del-inline b { color: var(--danger); }
  .menu-item.row .del-inline .sp { flex: 1; }
  /* 확인 팝오버 (App.popover): 앵커 근처에 띄우는 작은 질문+버튼 상자 */
  .popover { position: absolute; z-index: 60; width: 300px; max-width: calc(100vw - 16px); background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px rgba(15,23,42,.16); padding: 12px 14px; }
  .popover .pop-text { font-size: 13.5px; line-height: 1.5; color: var(--text); margin-bottom: 10px; word-break: keep-all; }
  .popover .pop-text b { font-weight: 700; }
  .popover .pop-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  /* 일괄 검토 모달 */
  .review-item { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: #fffbeb; }
  .review-item .rv-name { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .review-item .rv-raw { font-size: 12.5px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; margin-top: 6px; word-break: break-all; }
  .review-item .rv-meta { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .review-progress { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .review-progress .bar { flex: 1; height: 6px; background: #e5e7eb; border-radius: 999px; margin: 0 12px; overflow: hidden; }
  .review-progress .bar i { display: block; height: 100%; background: var(--primary); transition: width .2s; }
  .menu-item .more-btn { width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 16px; font-weight: 800; line-height: 1; letter-spacing: 1px; cursor: pointer; padding: 0; }
  .menu-item .more-btn:hover { background: #e5e7eb; color: var(--text); }
  /* 드롭다운 메뉴 (App.dropdown — 행의 "···" 더보기): body 에 직접 붙어 절대 좌표로 뜬다 */
  .dropdown { position: absolute; z-index: 60; min-width: 150px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(15,23,42,.14); padding: 4px; }
  .dropdown button { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 13.5px; color: var(--text); cursor: pointer; white-space: nowrap; }
  .dropdown button:hover { background: #f3f4f6; }
  .dropdown button.danger { color: var(--danger); }
  /* 목록 상단 고정 헤더 + 내부 스크롤 (약 6명 높이) */
  .list-box { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .list-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 700; color: #374151; padding: 8px 12px; background: #f9fafb; border-bottom: 1px solid var(--border); }
  .list-scroll { max-height: 384px; overflow-y: auto; padding: 8px; }
  .list-scroll .affected-list, .list-scroll .menu-list { gap: 6px; }
  .list-scroll .empty { padding: 18px 8px; }

  /* 토글 목록: 라벨 왼쪽, 스위치 오른쪽 한 줄 */
  .toggle-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: #fff; }
  .toggle-row:last-child { border-bottom: 0; }
  .toggle-row .t-label { font-size: 13.5px; font-weight: 600; }
  .toggle-row .t-help { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .toggle-row .t-right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .section-title { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 4px 0 8px; letter-spacing: .02em; }
  .stack > * + * { margin-top: 14px; }

  /* 툴바(필터·기간 선택 등): 높이·간격 통일 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar > * { flex: 0 0 auto; }                      /* 항목이 내용보다 작게 줄어들지 않게 */
  .toolbar input, .toolbar select { height: 36px; width: auto; }
  .toolbar select, .page-head .actions select { min-width: 100px; padding-right: 28px; }
  .toolbar .check, .toolbar label.small { white-space: nowrap; }
  .toolbar label.small { color: var(--muted); font-weight: 600; }
  select { min-width: 100px; }
  @media (max-width: 640px) { .toolbar input[type=text] { flex: 1 1 100%; width: 100%; } }
  .btn { height: 36px; }
  .btn.sm { height: 30px; }
  .btn.icon { height: auto; }
  .page-head .actions input, .page-head .actions select { height: 36px; width: auto; }

  /* 모달 / 토스트 */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(17, 24, 39, .45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 40px 12px; overflow-y: auto; }
  .modal { background: var(--card); border-radius: 14px; width: 100%; max-width: 640px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal.wide { max-width: 980px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-body { padding: 18px 20px; max-height: calc(100vh - 220px); overflow-y: auto; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .modal-foot .left { margin-right: auto; }
  @media (max-width: 640px) { .modal-backdrop { padding: 12px 8px; } .modal-body { max-height: calc(100vh - 170px); } }
  #toast-root { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 90vw; animation: toast-in .2s ease-out; }
  .toast.danger { background: var(--danger); }
  .toast.ok { background: var(--ok); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* 스켈레톤 */
  .sk { background: linear-gradient(90deg, #e9edf3 25%, #f4f6fa 37%, #e9edf3 63%); background-size: 400% 100%; animation: sk 1.3s ease-in-out infinite; border-radius: 8px; }
  @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .sk-line { height: 14px; margin: 8px 0; }
  .sk-title { height: 26px; width: 40%; margin-bottom: 16px; }
  .sk-stat { height: 92px; }
  .sk-block { height: 200px; }
  .sk-cell { height: 84px; }
  .sk-row { display: grid; grid-template-columns: 1fr 2fr 2fr 1fr; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border); }
  .sk-row .sk { height: 14px; margin: 0; }
  .spinner { width: 18px; height: 18px; border: 2px solid #cbd5e1; border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 30px; justify-content: center; }

  /* 로그인 */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card { width: 100%; max-width: 380px; }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card .sub { color: var(--muted); margin-bottom: 18px; }

  /* 인쇄 */
  /* ---------- 인쇄 문서 (화면 미리보기 = A4 인쇄) ---------- */
  /* 세그먼트 버튼 (인쇄 화면의 모드·방향 선택): 한 덩어리 안에서 하나만 .on */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: none; padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--text); border-right: 1px solid var(--border); white-space: nowrap; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--primary); color: #fff; font-weight: 600; }
  /* .print-doc: 화면에서도 A4 실크기(mm)로 그려 미리보기 = 인쇄 결과가 되게 한다. .l = 가로 방향 */
  .print-doc { width: 210mm; min-height: 297mm; margin: 0 auto 18px; padding: 14mm 12mm 16mm; box-sizing: border-box; background: #fff; border: 1px solid var(--border); box-shadow: 0 2px 14px rgba(15,23,42,.08); color: #111; font-size: 10.5pt; line-height: 1.4; }
  .print-doc.l { width: 297mm; min-height: 210mm; }
  .pd-head { border-bottom: 2px solid #111; padding-bottom: 6px; margin-bottom: 10px; }
  .pd-title { font-size: 16pt; font-weight: 800; letter-spacing: -0.3px; }
  .pd-sub { font-size: 9.5pt; color: #444; margin-top: 3px; }
  /* 반 제목 = <caption>: 페이지 끝에 혼자 남지 않게(break-after: avoid), 첫 2행(tbody.pd-first)과 한 블록 */
  .pd-class { display: table-caption; caption-side: top; text-align: left; padding: 14px 0 4px;
              break-after: avoid; page-break-after: avoid; break-inside: avoid; page-break-inside: avoid; }
  .pd-sec:first-of-type .pd-class { padding-top: 0; }
  .pd-class b { font-size: 12pt; margin-right: 10px; }
  .pd-class span { color: #444; font-size: 9.5pt; margin-right: 10px; }
  .pd-class .n { float: right; margin-right: 3mm; }
  /* 선 그리기: 페이지가 나뉘는 곳에서 마지막 행의 "아래 선"이 사라지는 Chromium 특성이 있어
     행은 위 선만 그리고, 표 아래 선은 tfoot(쪽마다 반복되는 table-footer-group)의 위 선으로 닫는다 */
  .pd-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 10pt; }
  .pd-table th, .pd-table td { border: 0; border-top: 1px solid #999; border-left: 1px solid #999; padding: 4px 6px; vertical-align: top; word-break: keep-all; white-space: normal; max-width: none; }
  .pd-table th:last-child, .pd-table td:last-child { border-right: 1px solid #999; }
  .pd-table tfoot { display: table-footer-group; }
  .pd-table tfoot td { border: 0; border-top: 1px solid #999; padding: 0; height: 1px; line-height: 0; font-size: 0; }  /* 높이 0 이면 선이 안 그려지므로 1px 높이 + 위 선 (배경 아님 → 배경 그래픽 꺼도 인쇄됨) */
  .pd-table th { background: #eee; font-weight: 700; text-align: center; white-space: nowrap; }
  .pd-table td.c { text-align: center; white-space: nowrap; }
  .pd-table td.menu { overflow-wrap: anywhere; }
  .pd-table thead { display: table-header-group; break-after: avoid; page-break-after: avoid; }   /* 페이지 넘어가면 헤더 반복, 헤더만 남지 않게 */
  .pd-table tr { break-inside: avoid !important; page-break-inside: avoid !important; }           /* 행 중간에서 절대 안 잘리게 */
  .pd-table tbody.pd-first { break-inside: avoid; page-break-inside: avoid; }                     /* 제목+헤더+첫 2행 한 덩어리 */
  .pd-sec { break-inside: auto; page-break-inside: auto; }
  .pd-page { break-after: page; page-break-after: always; }
  .pd-page:last-child { break-after: auto; page-break-after: auto; }
  .print-doc .empty { padding: 30px 0; text-align: center; color: #666; }
  /* 통신문(학생별 안내문): 정보 표 + 달력 표 + 날짜별 표. 못 먹는 날은 연한 빨강(배경 그래픽 꺼도 굵은 테두리로 구분) */
  .notice-doc { font-size: 10.5pt; line-height: 1.5; }
  .nd-p { margin: 8px 0 10px; text-align: justify; word-break: keep-all; }
  .nd-p.nd-ok { text-align: center; padding: 10px; border: 1px dashed #999; }
  .nd-info { width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 9.5pt; }
  .nd-info th, .nd-info td { border: 1px solid #999; padding: 4px 8px; text-align: left; white-space: normal; }
  .nd-info th { background: #eee; width: 20mm; font-weight: 700; white-space: nowrap; }
  .pd-cal { width: 100%; table-layout: fixed; border-collapse: collapse; margin: 4px 0 4px; }
  .pd-cal th { border: 1px solid #999; background: #eee; font-size: 9pt; padding: 3px 0; text-align: center; font-weight: 700; }
  .pd-cal th.sun { color: #b91c1c; } .pd-cal th.sat { color: #1d4ed8; }
  .pd-cal td { border: 1px solid #999; height: 19mm; vertical-align: top; padding: 2px 4px 3px; font-size: 8.5pt; line-height: 1.25; white-space: normal; word-break: keep-all; }
  .pd-cal td .d { font-weight: 700; font-size: 9pt; }
  .pd-cal td.sun .d { color: #b91c1c; } .pd-cal td.sat .d { color: #1d4ed8; }
  .pd-cal td .m { color: #7f1d1d; font-weight: 600; }
  .pd-cal td .m.none { color: #999; font-weight: 500; font-size: 8pt; }
  .pd-cal td.hit { background: #fde2e2; border: 1.5px solid #b91c1c; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pd-cal td.dim { background: #f3f4f6; color: #999; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .nd-legend { font-size: 8.5pt; color: #444; margin: 2px 0 10px; }
  .nd-legend .sw { display: inline-block; width: 10px; height: 10px; border: 1px solid #999; vertical-align: -1px; margin-right: 3px; }
  .nd-legend .sw.hit { background: #fde2e2; border-color: #b91c1c; } .nd-legend .sw.dim { background: #f3f4f6; }
  .nd-list { margin-bottom: 10px; font-size: 9.5pt; }
  .nd-foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; font-size: 10pt; }
  .nd-foot .nd-school { font-size: 13pt; font-weight: 800; letter-spacing: 2px; }
  /* ---------- 전광판 모드 (#/board) ---------- */
  body.board-mode { background: #0b1220; }
  body.board-mode .topbar, body.board-mode #toast-root { display: none !important; }
  body.board-mode .main { max-width: none; padding: 0; }
